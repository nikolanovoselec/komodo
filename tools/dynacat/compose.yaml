services:
  dynacat:
    image: panonim/dynacat:3.0.0
    container_name: tools_dynacat
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config
      - ./assets:/app/assets
    environment:
      LOG_LEVEL: INFO
      ENABLE_EDITOR: "false"
      # Values are injected by Komodo, never committed in this repository.
      SONARR_API_KEY: ${SONARR_API_KEY}
      RADARR_API_KEY: ${RADARR_API_KEY}
    restart: unless-stopped
    network_mode: bridge
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
