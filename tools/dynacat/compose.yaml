services:
  workload-summary:
    image: python:3.13-slim@sha256:9d2e5553305c7c7b0097999bb17187c69b921ccd6bc9d40e4bb5ebe652c00285
    container_name: tools_dynacat_workload_summary
    labels:
      ch.graymatter.config-revision: "construct-dashboard-followup-31"
    command: ["python", "-B", "/app/adapter.py"]
    user: "65534:65534"
    volumes:
      - ./adapter:/app:ro
    environment:
      SONARR_API_KEY: ${SONARR_API_KEY}
      RADARR_API_KEY: ${RADARR_API_KEY}
      DYNACAT_PLEX_TOKEN: ${DYNACAT_PLEX_TOKEN}
      DYNACAT_GITHUB_TOKEN: ${DYNACAT_GITHUB_TOKEN}
      DYNACAT_KOMODO_API_KEY: ${DYNACAT_KOMODO_API_KEY}
      DYNACAT_KOMODO_API_SECRET: ${DYNACAT_KOMODO_API_SECRET}
      DYNACAT_PROXMOX_SECRET: ${DYNACAT_PROXMOX_SECRET}
      DYNACAT_PROXMOX_TOKEN_ID: ${DYNACAT_PROXMOX_TOKEN_ID}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=30)"]
      interval: 30s
      timeout: 35s
      retries: 3
      start_period: 30s
  dynacat:
    image: panonim/dynacat:3.0.0
    container_name: tools_dynacat
    depends_on:
      workload-summary:
        condition: service_healthy
    labels:
      # Bump when tracked config/assets change: Komodo DeployStackIfChanged compares Compose.
      ch.graymatter.config-revision: "construct-header-spacing-33"
    expose: ["8080"]
    volumes:
      - ./config:/app/config
      - ./assets:/app/assets
    environment:
      LOG_LEVEL: INFO
      ENABLE_EDITOR: "false"
      # Values are injected by Komodo, never committed in this repository.
      SONARR_API_KEY: ${SONARR_API_KEY}
      RADARR_API_KEY: ${RADARR_API_KEY}
      DYNACAT_KOMODO_API_KEY: ${DYNACAT_KOMODO_API_KEY}
      DYNACAT_KOMODO_API_SECRET: ${DYNACAT_KOMODO_API_SECRET}
      DYNACAT_PROXMOX_SECRET: ${DYNACAT_PROXMOX_SECRET}
      DYNACAT_PROXMOX_TOKEN_ID: ${DYNACAT_PROXMOX_TOKEN_ID}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  radio:
    image: python:3.13-slim@sha256:9d2e5553305c7c7b0097999bb17187c69b921ccd6bc9d40e4bb5ebe652c00285
    container_name: tools_dynacat_radio
    command: ["python", "-B", "/app/radio.py"]
    user: "65534:65534"
    volumes:
      - ./adapter:/app:ro
    environment:
      DYNACAT_PLEX_TOKEN: ${DYNACAT_PLEX_TOKEN}
    expose: ["8091"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  gateway:
    image: nginxinc/nginx-unprivileged:1.28.0-alpine@sha256:c97ff0bf7cbae369953c6da1232ec14ad9f971d66360c5698db0856a4cd657a0
    container_name: tools_dynacat_gateway
    labels:
      ch.graymatter.config-revision: "construct-dashboard-followup-31"
    depends_on: [dynacat, radio]
    ports: ["8080:8080"]
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
