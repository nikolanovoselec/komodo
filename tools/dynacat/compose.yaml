services:
  workload-summary:
    image: local/dynacat-geoip:1
    build:
      context: ./adapter
      dockerfile: Dockerfile.geoip
    pull_policy: build
    container_name: tools_dynacat_workload_summary
    labels:
      ch.graymatter.config-revision: "construct-arr-posters-64"
    command: ["python", "-B", "/app/adapter.py"]
    user: "65534:65534"
    volumes:
      - ./adapter:/app:ro
      - geoip-city:/geoip:ro
      - telemetry-history:/history
    environment:
      WORKLOAD_HISTORY_PATH: /history/workloads.sqlite
      MEDIA_HISTORY_PATH: /history/media.sqlite
      UNIFI_HISTORY_PATH: /history/unifi.sqlite
      PIHOLE_HISTORY_PATH: /history/pihole.json
      SONARR_API_KEY: ${SONARR_API_KEY}
      RADARR_API_KEY: ${RADARR_API_KEY}
      DYNACAT_PLEX_TOKEN: ${DYNACAT_PLEX_TOKEN}
      DYNACAT_GITHUB_TOKEN: ${DYNACAT_GITHUB_TOKEN}
      DYNACAT_UNIFI_TOKEN: ${DYNACAT_UNIFI_TOKEN}
      PIHOLE_API_KEY: ${PIHOLE_API_KEY}
      DYNACAT_KOMODO_API_KEY: ${DYNACAT_KOMODO_API_KEY}
      DYNACAT_KOMODO_API_SECRET: ${DYNACAT_KOMODO_API_SECRET}
      DYNACAT_PROXMOX_SECRET: ${DYNACAT_PROXMOX_SECRET}
      DYNACAT_PROXMOX_TOKEN_ID: ${DYNACAT_PROXMOX_TOKEN_ID}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=30)"]
      interval: 30s
      timeout: 35s
      retries: 3
      start_period: 30s
  dynacat:
    image: panonim/dynacat:3.0.0
    container_name: tools_dynacat
    depends_on:
      workload-summary:
        condition: service_healthy
    labels:
      # Bump when tracked config/assets change: Komodo DeployStackIfChanged compares Compose.
      ch.graymatter.config-revision: "typography-scale-1.2"
    expose: ["8080"]
    volumes:
      - ./config:/app/config
      - ./assets:/app/assets
    environment:
      LOG_LEVEL: INFO
      ENABLE_EDITOR: "false"
      # Values are injected by Komodo, never committed in this repository.
      SONARR_API_KEY: ${SONARR_API_KEY}
      RADARR_API_KEY: ${RADARR_API_KEY}
      DYNACAT_KOMODO_API_KEY: ${DYNACAT_KOMODO_API_KEY}
      DYNACAT_KOMODO_API_SECRET: ${DYNACAT_KOMODO_API_SECRET}
      DYNACAT_PROXMOX_SECRET: ${DYNACAT_PROXMOX_SECRET}
      DYNACAT_PROXMOX_TOKEN_ID: ${DYNACAT_PROXMOX_TOKEN_ID}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  radio:
    image: python:3.13-slim@sha256:8d9d0b8bcf6506481eae4907c18f5e3e7902e629f5f6d684f9e7c32e85e3ddf0
    container_name: tools_dynacat_radio
    labels:
      ch.graymatter.config-revision: "construct-radio-identity-34"
    command: ["python", "-B", "/app/radio.py"]
    user: "65534:65534"
    volumes:
      - ./adapter:/app:ro
    environment:
      DYNACAT_PLEX_TOKEN: ${DYNACAT_PLEX_TOKEN}
    expose: ["8091"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  geoip-update:
    image: local/dynacat-geoip:1
    build:
      context: ./adapter
      dockerfile: Dockerfile.geoip
    pull_policy: build
    container_name: tools_dynacat_geoip_update
    command: ["python", "-B", "/app/geoip_update.py", "--month", "2026-09", "--watch"]
    user: "65534:65534"
    volumes:
      - geoip-city:/geoip
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-B", "/app/geoip_update.py", "--month", "2026-09", "--check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
      start_interval: 5s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 32
  gateway:
    image: nginxinc/nginx-unprivileged:1.28.0-alpine@sha256:c97ff0bf7cbae369953c6da1232ec14ad9f971d66360c5698db0856a4cd657a0
    container_name: tools_dynacat_gateway
    labels:
      ch.graymatter.config-revision: "construct-mobile-scroll-state-61"
    depends_on: [dynacat, radio]
    ports: ["8080:8080"]
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  geoip-city:
  telemetry-history:
