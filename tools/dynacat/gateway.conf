# Cloudflare Access remains the outer access boundary; no public radio backend.
server {
    listen 8080;
    server_tokens off;
    access_log off;
    client_max_body_size 1m;
    location = /radio/queue {
        limit_except GET { deny all; }
        proxy_pass http://radio:8091;
        proxy_buffering off;
    }
    location ~ "^/radio/stream/[0-9]{1,20}$" {
        limit_except GET { deny all; }
        proxy_pass http://radio:8091;
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_set_header Range $http_range;
    }
    location /radio { return 404; }
    location / {
        proxy_pass http://dynacat:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
