# Cloudflare Access remains the outer access boundary; no public radio backend.
server {
    listen 8080;
    server_tokens off;
    access_log off;
    client_max_body_size 1m;
    location = /radio/queue {
        limit_except GET { deny all; }
        proxy_pass http://radio:8091;
        proxy_buffering off;
    }
    location ~ "^/radio/stream/[0-9]{1,20}$" {
        limit_except GET { deny all; }
        proxy_pass http://radio:8091;
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_set_header Range $http_range;
    }
    location /radio { return 404; }
    # Narrow Dynacat 3.0 lifecycle hook: reuse the native module's initializers,
    # not a second copy of its polling/SSE machinery. Revalidate on upgrades.
    location ~ "^/static/[a-f0-9]+/js/page\\.js$" {
        proxy_pass http://dynacat:8080;
        proxy_set_header Host $http_host;
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/javascript text/javascript;
        sub_filter 'setupPage().then(() => {' 'import("/assets/dashboard-navigation.js?v=7df715a9ee03").then(({installNavigation}) => installNavigation({pageData, activate: (first) => { if(first) setupClocks(); _runPostSettleSetup(); setupWidgetPolling(); fetchLazyWidgets(); }})); setupPage().then(() => {';
    }
    location / {
        proxy_set_header Accept-Encoding "";
        sub_filter '/js/page.js' '/js/page.js?construct-nav=2';
        proxy_pass http://dynacat:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
