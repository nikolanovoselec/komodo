pages:
- name: HARDWARE & WORKLOADS
  slug: hardware-workloads
  width: wide
  desktop-navigation-width: wide
  key-bind: d h
  columns:
  - size: full
    widgets:
    - type: custom-api
      title: Proxmox Cluster
      css-class: komodo-widget pve-resources
      cache: 1s
      update-interval: 1s
      url: http://workload-summary:8090/pve-current
      template: '{{ if .JSON.String "error" }}<div class="k-warning">{{ .JSON.String "error" }}</div>{{ else }}{{ if eq (.JSON.String "freshness.state") "expired" }}<div class="k-warning">Data is stale</div>{{ end }}{{ if .JSON.String "pve.error" }}<div class="k-warning">{{ .JSON.String "pve.error" }}</div>{{ else }}

        <div class="pve-heading"><span>PHYSICAL HYPERVISORS</span></div>

        <div class="pve-grid">{{ range .JSON.Array "pve.nodes" }}<a class="pve-node cc-resource-link" href="{{ .String "url" }}" rel="noopener noreferrer">

        <header><strong>{{ .String "name" }}</strong><span class="k-state {{ if ne (.String "status") "online" }}k-warning{{ end }}">● {{ .String "status"
        }}</span></header>

        <div class="pve-cpu"><span class="pve-label">CPU</span>{{ if ne (.String "cpu_percent") "" }}<strong>{{ printf "%.1f" (.Float "cpu_percent") }}<em>%</em></strong><meter aria-label="CPU
        utilization" min="0" max="100" value="{{ .Float "cpu_percent" }}"></meter>{{ else }}<strong>N/A</strong>{{ end }}

        {{ if gt (.Int "history.samples") 1 }}<svg class="pve-spark" viewBox="0 0 100 30" preserveAspectRatio="none" role="img" aria-label="CPU utilization over the last 30 minutes, fixed
        0 to 100 percent scale"><path d="M0 30 H100 M0 15 H100" class="pve-gridline"/>{{ range .Array "history.cpu_segments" }}<polyline points="{{ .String "" }}"/>{{ end }}</svg><div class="pve-caption"><span>CPU
        · {{ .String "history.window" }} history</span><span>{{ .Int "history.samples" }} samples</span></div>{{ else }}<div class="pve-no-history">History unavailable</div>{{ end }}</div>

        <div class="pve-capacities">

        <div class="pve-capacity"><label>MEMORY {{ if ne (.String "ram.percent") "" }}<b>{{ printf "%.1f" (.Float "ram.percent") }}%</b></label><meter aria-label="Memory used" min="0"
        max="100" value="{{ .Float "ram.percent" }}"></meter><small>{{ printf "%.1f" (div (.Float "ram.used_bytes") 1073741824) }} / {{ printf "%.1f" (div (.Float "ram.total_bytes")
        1073741824) }} GiB{{ else }}<b>N/A</b></label><small>Reading unavailable{{ end }}</small></div>


        </div>

        <div class="pve-zfs">{{ range .Array "zfs" }}<div class="pve-capacity"><label>ZFS · {{ .String "name" }} {{ if ne (.String "percent") "" }}<b>{{ printf "%.1f" (.Float "percent")
        }}%</b></label><meter aria-label="ZFS pool allocated" min="0" max="100" value="{{ .Float "percent" }}"></meter><small>{{ printf "%.1f" (div (.Float "used_bytes") 1073741824)
        }} / {{ printf "%.1f" (div (.Float "total_bytes") 1073741824) }} GiB · <b>{{ printf "%.1f" (div (.Float "free_bytes") 1073741824) }} GiB free</b></small>{{ else }}<b>N/A</b></label>{{
        end }}<small>{{ if eq (.String "scope") "physical_pool" }}Physical pool allocation{{ else }}ZFS-backed storage · not whole pool{{ end }}</small></div>{{ else }}<span class="pve-label">ZFS</span><small>{{
        if eq (.String "zfs_state") "none" }}No ZFS pools reported{{ else }}ZFS telemetry unavailable{{ end }}</small>{{ end }}{{ if .String "zfs_error" }}<small class="k-warning">{{
        .String "zfs_error" }}</small>{{ end }}</div>

        <div class="pve-network"><span class="pve-label">NETWORK ACTIVITY <small>{{ .String "history.window" }} · 1m averages</small></span>

        {{ if or (gt (len (.Array "history.net_rx_segments")) 0) (gt (len (.Array "history.net_tx_segments")) 0) }}<svg class="pve-netgraph" viewBox="0 0 100 30" preserveAspectRatio="none"
        role="img" aria-label="Real network receive and transmit history, bytes per second"><path d="M0 0 H100 M0 15 H100 M0 30 H100" class="pve-gridline"/>{{ range .Array "history.net_rx_segments"
        }}<polyline class="pve-rx" points="{{ .String "" }}"/>{{ end }}{{ range .Array "history.net_tx_segments" }}<polyline class="pve-tx" points="{{ .String "" }}"/>{{ end }}</svg><div
        class="pve-netaxis"><span>{{ .String "history.window" }} ago</span><span>0–{{ printf "%.1f" (div (.Float "history.net_scale_bytes_sec") 1048576) }} MiB/s</span><span>latest</span></div>{{
        else }}<div class="pve-no-net">Network history unavailable</div>{{ end }}<div>{{ if ne (.String "net_in_bytes_sec") "" }}<span class="pve-rx-label">↓ RX <b>{{ printf "%.1f" (div
        (.Float "net_in_bytes_sec") 1024) }}</b> KiB/s</span>{{ else }}<span>↓ N/A</span>{{ end }}{{ if ne (.String "net_out_bytes_sec") "" }}<span class="pve-tx-label">↑ TX <b>{{ printf
        "%.1f" (div (.Float "net_out_bytes_sec") 1024) }}</b> KiB/s</span>{{ else }}<span>↑ N/A</span>{{ end }}</div></div>

        <footer><span><b>{{ .Int "guests.qemu.running" }}</b>/{{ .Int "guests.qemu.total" }} VM</span><span><b>{{ .Int "guests.lxc.running" }}</b>/{{ .Int "guests.lxc.total" }} LXC</span><small>running
        / total</small></footer>

        </a>{{ end }}</div>{{ end }}{{ end }}'
      title-url: https://proxmox.graymatter.ch
    - type: custom-api
      title: Workloads
      title-url: https://proxmox.graymatter.ch
      css-class: komodo-widget komodo-hosts pve-guests cw-merged
      cache: 1s
      update-interval: 1s
      url: http://workload-summary:8090/current
      template: '{{ if .JSON.String "error" }}<div class="k-warning">{{ .JSON.String "error" }}</div>{{ else }}<div class="cw-status"><span class="{{ if gt (len (.JSON.Array "container_problems")) 0 }}cw-issue{{ else }}cw-normal{{ end }}">{{ len (.JSON.Array "container_problems") }} container issues</span><span aria-hidden="true">·</span><span class="{{ if gt (len (.JSON.Array "stack_problems")) 0 }}cw-issue{{ else }}cw-normal{{ end }}">{{ len (.JSON.Array "stack_problems") }} stack issues</span></div><div class="cw-overview"><span><b>{{ len (.JSON.Array `pve.guest_inventory.#(status=="running")#`) }}</b> running VM / LXC guests</span><span><b>{{ .JSON.Int "running_containers" }}/{{ .JSON.Int "containers_total" }}</b> enabled Docker containers</span><span><b>{{ .JSON.Int "running_stacks" }}/{{ .JSON.Int "stacks_total" }}</b> stacks running</span></div>{{ if eq (.JSON.String "freshness.state") "expired" }}<div class="k-warning">Data is stale</div>{{ end }}{{ if .JSON.String "pve.error" }}<div class="k-warning">{{ .JSON.String "pve.error" }}</div>{{ else }}<div class="cw-matrix-head"><div class="pve-matrix-head"><span>WORKLOAD / NODE</span><div><span>CPU</span><span>RAM</span><span>DISK USED</span></div></div><span>DOCKER · PER MACHINE</span></div><div class="k-host-grid cw-workloads">{{ range .JSON.Array `pve.guest_inventory.#(status=="running")#` }}<article class="cw-workload"><a title="CPU: Proxmox; RAM: {{ .String "memory_scope" }}; Disk: {{ .String "disk_scope" }}" class="k-host cc-resource-link" href="{{ .String "url" }}" rel="noopener noreferrer"><header><strong>{{ .String "name" }}</strong><span class="pve-guest-meta">{{ if eq (.String "type") "qemu" }}VM{{ else }}LXC{{ end }} {{ .Int "id" }} · {{ .String "node" }}</span><span class="k-state">● {{ .String "status" }}</span></header><div class="k-metrics"><div class="cw-history-metric pve-guest-cpu"><label>CPU {{ if ne (.String "cpu_percent") "" }}<b>{{ printf "%.1f" (.Float "cpu_percent") }}%</b>{{ else }}<b>N/A</b>{{ end }}</label><div class="cw-history-chart" title="{{ .String "history.cpu.source" }}; {{ .String "memory_scope" }}; {{ .String "disk_scope" }}"><svg viewBox="0 0 100 30" preserveAspectRatio="none" role="img" aria-label="CPU last 30 minutes; scale 0 to {{ .Float "history.cpu.scale" }} percent"><path class="cw-history-grid" d="M0 0H100 M0 15H100 M0 30H100"/><path class="cw-history-area" d="{{ .String "history.cpu.area_path" }}"/><path class="cw-history-line" d="{{ .String "history.cpu.path" }}"/>{{ range .Array "history.cpu.dots" }}<circle cx="{{ .Float "x" }}" cy="{{ .Float "y" }}" r=".65"/>{{ end }}</svg>{{ if lt (.Int "history.cpu.samples") 2 }}<span class="cw-history-empty">{{ if eq (.Int "history.cpu.samples") 0 }}No samples{{ else }}Collecting{{ end }}</span>{{ end }}</div><div class="cw-history-axis"><span>−30m</span><span>0–{{ printf "%.0f" (.Float "history.cpu.scale") }}%</span><span>now</span></div><small>Current utilization</small></div><div class="cw-history-metric pve-guest-ram"><label>MEMORY {{ if ne (.String "ram.percent") "" }}<b>{{ printf "%.1f" (.Float "ram.percent") }}%</b>{{ else }}<b>N/A</b>{{ end }}</label><div class="cw-history-chart" title="{{ .String "history.ram.source" }}; {{ .String "memory_scope" }}; {{ .String "disk_scope" }}"><svg viewBox="0 0 100 30" preserveAspectRatio="none" role="img" aria-label="RAM last 30 minutes; scale 0 to {{ .Float "history.ram.scale" }} percent"><path class="cw-history-grid" d="M0 0H100 M0 15H100 M0 30H100"/><path class="cw-history-area" d="{{ .String "history.ram.area_path" }}"/><path class="cw-history-line" d="{{ .String "history.ram.path" }}"/>{{ range .Array "history.ram.dots" }}<circle cx="{{ .Float "x" }}" cy="{{ .Float "y" }}" r=".65"/>{{ end }}</svg>{{ if lt (.Int "history.ram.samples") 2 }}<span class="cw-history-empty">{{ if eq (.Int "history.ram.samples") 0 }}No samples{{ else }}Collecting{{ end }}</span>{{ end }}</div><div class="cw-history-axis"><span>−30m</span><span>0–{{ printf "%.0f" (.Float "history.ram.scale") }}%</span><span>now</span></div><small>{{ if ne (.String "ram.used_bytes") "" }}{{ printf "%.1f" (div (.Float "ram.used_bytes") 1073741824) }} / {{ printf "%.1f" (div (.Float "ram.total_bytes") 1073741824) }} GiB{{ else }}Not reported{{ end }}</small></div><div class="cw-history-metric pve-guest-disk"><label>DISK USED {{ if ne (.String "disk.percent") "" }}<b>{{ printf "%.1f" (.Float "disk.percent") }}%</b>{{ else }}<b>N/A</b>{{ end }}</label><div class="cw-history-chart" title="{{ .String "history.disk.source" }}; {{ .String "memory_scope" }}; {{ .String "disk_scope" }}"><svg viewBox="0 0 100 30" preserveAspectRatio="none" role="img" aria-label="HDD last 30 minutes; scale 0 to {{ .Float "history.disk.scale" }} percent"><path class="cw-history-grid" d="M0 0H100 M0 15H100 M0 30H100"/><path class="cw-history-area" d="{{ .String "history.disk.area_path" }}"/><path class="cw-history-line" d="{{ .String "history.disk.path" }}"/>{{ range .Array "history.disk.dots" }}<circle cx="{{ .Float "x" }}" cy="{{ .Float "y" }}" r=".65"/>{{ end }}</svg>{{ if lt (.Int "history.disk.samples") 2 }}<span class="cw-history-empty">{{ if eq (.Int "history.disk.samples") 0 }}No samples{{ else }}Collecting{{ end }}</span>{{ end }}</div><div class="cw-history-axis"><span>−30m</span><span>0–{{ printf "%.0f" (.Float "history.disk.scale") }}%</span><span>now</span></div><small>{{ if ne (.String "disk.percent") "" }}{{ printf "%.1f" (div (.Float "disk.used_bytes") 1073741824) }} GiB used{{ else if gt (.Float "disk.total_bytes") 0.0 }}{{ printf "%.0f" (div (.Float "disk.total_bytes") 1073741824) }} GiB allocated{{ else }}Not reported{{ end }}</small></div></div></a><details class="cw-docker"><summary aria-expanded="false" aria-controls="cw-containers-{{ .String "type" }}-{{ .Int "id" }}"><strong class="cw-detail-key">{{ .String "type" }} #{{ .Int "id" }} containers</strong>{{ if .Bool "docker.available" }}<div class="cw-docker-count"><b>{{ .Int "docker.running" }}<small>/{{ .Int "docker.total" }}</small></b><span>containers running</span><i>▸</i></div>{{ if or (gt (.Int "docker.failed") 0) (gt (.Int "docker.unhealthy") 0) (gt (len (.Array "docker.stack_problems")) 0) }}<div class="cw-alert">{{ .Int "docker.failed" }} stopped / other · {{ .Int "docker.unhealthy" }} unhealthy · {{ len (.Array "docker.stack_problems") }} stack issues</div>{{ end }}{{ else }}<div class="cw-no-docker">{{ if .String "docker.status" }}{{ .String "docker.status" }}{{ else }}No Docker data{{ end }}</div>{{ if gt (len (.Array "docker.stack_problems")) 0 }}<div class="cw-alert">{{ len (.Array "docker.stack_problems") }} stack issues ▸</div>{{ end }}{{ end }}</summary><div class="cw-docker-expanded" id="cw-containers-{{ .String "type" }}-{{ .Int "id" }}">{{ if .Bool "docker.available" }}{{ else }}<p class="cw-docker-scope">No current identity-verified Docker inventory. This is not a claim of zero containers or no installed daemon.</p>{{ end }}<div class="cw-container-table">{{ range .Array "docker.containers" }}<a class="cw-container cc-container-link" href="{{ .String "url" }}" rel="noopener noreferrer"><div><strong>{{ .String "name" }}</strong><small>{{ .String "status" }}</small></div><span class="cw-state cw-state-{{ .String "state" }}">{{ .String "state" }}</span><span>{{ if ne (.String "cpu") "" }}{{ .Float "cpu" | printf "%.2f" }}% CPU{{ else }}CPU —{{ end }}</span><span>{{ .String "ram" }}</span></a>{{ end }}</div>{{ range .Array "docker.stack_problems" }}<div class="cw-problem"><a href="https://komodo.graymatter.ch/stacks/{{ .String "id" }}" rel="noopener noreferrer">{{ .String "name" }} ↗</a><span>{{ .String "state" }} · stack</span></div>{{ end }}</div></details></article>{{ end }}</div><details class="k-stack-group pve-stopped"><summary><strong>{{ len (.JSON.Array `pve.guest_inventory.#(status!="running")#`) }} stopped / other guests</strong><span>show inventory</span></summary>{{ range .JSON.Array `pve.guest_inventory.#(status!="running")#` }}<article class="cw-stopped-guest"><a class="k-top-row cc-resource-link" href="{{ .String "url" }}" rel="noopener noreferrer"><strong>{{ .String "name" }}</strong><small>{{ .String "node" }} · {{ .String "type" }} #{{ .Int "id" }} · {{ .String "status" }}</small></a><details class="cw-docker"><summary aria-expanded="false" aria-controls="cw-containers-{{ .String "type" }}-{{ .Int "id" }}"><strong class="cw-detail-key">{{ .String "type" }} #{{ .Int "id" }} containers</strong>{{ if .Bool "docker.available" }}<div class="cw-docker-count"><b>{{ .Int "docker.running" }}<small>/{{ .Int "docker.total" }}</small></b><span>containers running</span><i>▸</i></div>{{ if or (gt (.Int "docker.failed") 0) (gt (.Int "docker.unhealthy") 0) (gt (len (.Array "docker.stack_problems")) 0) }}<div class="cw-alert">{{ .Int "docker.failed" }} stopped / other · {{ .Int "docker.unhealthy" }} unhealthy · {{ len (.Array "docker.stack_problems") }} stack issues</div>{{ end }}{{ else }}<div class="cw-no-docker">{{ if .String "docker.status" }}{{ .String "docker.status" }}{{ else }}No Docker data{{ end }}</div>{{ if gt (len (.Array "docker.stack_problems")) 0 }}<div class="cw-alert">{{ len (.Array "docker.stack_problems") }} stack issues ▸</div>{{ end }}{{ end }}</summary><div class="cw-docker-expanded" id="cw-containers-{{ .String "type" }}-{{ .Int "id" }}">{{ if .Bool "docker.available" }}{{ else }}<p class="cw-docker-scope">No current identity-verified Docker inventory. This is not a claim of zero containers or no installed daemon.</p>{{ end }}<div class="cw-container-table">{{ range .Array "docker.containers" }}<a class="cw-container cc-container-link" href="{{ .String "url" }}" rel="noopener noreferrer"><div><strong>{{ .String "name" }}</strong><small>{{ .String "status" }}</small></div><span class="cw-state cw-state-{{ .String "state" }}">{{ .String "state" }}</span><span>{{ if ne (.String "cpu") "" }}{{ .Float "cpu" | printf "%.2f" }}% CPU{{ else }}CPU —{{ end }}</span><span>{{ .String "ram" }}</span></a>{{ end }}</div>{{ range .Array "docker.stack_problems" }}<div class="cw-problem"><a href="https://komodo.graymatter.ch/stacks/{{ .String "id" }}" rel="noopener noreferrer">{{ .String "name" }} ↗</a><span>{{ .String "state" }} · stack</span></div>{{ end }}</div></details></article>{{ end }}</details>{{ end }}{{ if .JSON.String "docker_exceptions.error" }}<div class="k-warning">{{ .JSON.String "docker_exceptions.error" }}</div>{{ else }}{{ if .JSON.Bool "docker_exceptions.show_any" }}<div class="cw-unmatched">{{ if .JSON.Bool "docker_exceptions.show_unmatched" }}<details class="k-stack-group"><summary><strong>{{ len (.JSON.Array "docker_unmatched") }} unmatched Docker hosts</strong><span>identity not joined</span></summary><div class="k-note">Enabled Docker hosts without an exact current Proxmox identity. No name-based or IP-only guessing.</div>{{ range .JSON.Array "docker_unmatched" }}<details class="cw-unmatched-host"><summary><strong>{{ .String "host" }}</strong><span>{{ if .Bool "available" }}{{ .Int "running" }}/{{ .Int "total" }} running · {{ .Int "failed" }} stopped / other · {{ .Int "unhealthy" }} unhealthy{{ else }}{{ .String "status" }}{{ end }} · {{ len (.Array "stack_problems") }} stack issues</span></summary><a class="cw-host-link" href="{{ .String "url" }}" rel="noopener noreferrer">Open exact Komodo host ↗</a><div class="cw-container-table">{{ range .Array "containers" }}<a class="cw-container cc-container-link" href="{{ .String "url" }}" rel="noopener noreferrer"><div><strong>{{ .String "name" }}</strong><small>{{ .String "status" }}</small></div><span class="cw-state cw-state-{{ .String "state" }}">{{ .String "state" }}</span><span>{{ if ne (.String "cpu") "" }}{{ .Float "cpu" | printf "%.2f" }}% CPU{{ else }}CPU —{{ end }}</span><span>{{ .String "ram" }}</span></a>{{ end }}</div>{{ range .Array "stack_problems" }}<div class="cw-problem"><a href="https://komodo.graymatter.ch/stacks/{{ .String "id" }}" rel="noopener noreferrer">{{ .String "name" }} ↗</a><span>{{ .String "state" }} · stack</span></div>{{ end }}</details>{{ end }}</details>{{ end }}{{ if .JSON.Bool "docker_exceptions.show_definitions" }}<details class="k-stack-group"><summary><strong>{{ len (.JSON.Array "definition_issues") }} unassigned definitions</strong><span>runtime unknown</span></summary><div class="k-note">Definitions without an assigned server/swarm are retained separately, not confirmed runtime incidents.</div>{{ range .JSON.Array "definition_issues" }}<a class="cw-container" href="https://komodo.graymatter.ch/stacks/{{ .String "id" }}" rel="noopener noreferrer"><strong>{{ .String "name" }}</strong><span>Unassigned · runtime unknown</span></a>{{ end }}</details>{{ end }}</div>{{ end }}{{ end }}{{ end }}'
    - type: custom-api
      title: Docker Containers - Top Consumers
      css-class: komodo-widget top-consumers
      cache: 1s
      update-interval: 1s
      url: http://workload-summary:8090/current
      template: '{{ if .JSON.String "error" }}<div class="k-warning">{{ .JSON.String "error" }}</div>{{ else }}{{ if eq (.JSON.String "freshness.state") "expired" }}<div class="k-warning">Data is stale</div>{{ end }}<div class="k-top-grid"><section><h3>CPU · top 5</h3>{{ range .JSON.Array "top_cpu" }}<div class="k-top-row"><div><a class="k-rank-link" href="{{ .String "url" }}"
        rel="noopener noreferrer">{{ .String "name" }}</a><small>{{ .String "host" }}</small></div><b>{{ printf "%.1f" (.Float "cpu") }}%</b></div>{{ else }}<p>CPU metrics unavailable</p>{{
        end }}</section><section><h3>RAM · top 5</h3>{{ range .JSON.Array "top_ram" }}<div class="k-top-row"><div><a class="k-rank-link" href="{{ .String "url" }}" rel="noopener
        noreferrer">{{ .String "name" }}</a><small>{{ .String "host" }}</small></div><b>{{ .String "ram" }}</b></div>{{ else }}<p>RAM metrics unavailable</p>{{ end }}</section><section><h3>Disk
        capacity · top 5 hosts</h3>{{ range .JSON.Array "top_disk" }}<div class="k-top-row"><div>{{ if .String "url" }}<a class="k-rank-link" href="{{ .String "url" }}" rel="noopener noreferrer">{{ .String "name" }}</a>{{ else }}<strong title="Proxmox identity not verified">{{ .String "name" }}</strong>{{ end }}<small>{{ printf "%.1f" (.Float "used") }} / {{ printf "%.1f" (.Float "total") }} GiB</small></div><b>{{ printf "%.1f" (.Float "percent") }}%</b></div>{{
        else }}<p>Disk metrics unavailable</p>{{ end }}</section></div>{{ end }}'
  - size: small
    widgets:
    - type: clock
      css-class: cc-rail-clock
      hour-format: 24h
      timezones:
      - timezone: Europe/Zurich
        label: Bern
      - timezone: Europe/London
        label: London
      - timezone: America/Los_Angeles
        label: San Francisco
      - timezone: America/New_York
        label: New York
    - type: html
      title: Bern · Switzerland
      css-class: cc-bern-calendar
      source: <section data-bern-calendar><div class="bern-calendar-header"><strong data-calendar-title></strong><div><button type="button" data-calendar-action="prev" aria-label="Previous month">‹</button><button type="button" data-calendar-action="next" aria-label="Next month">›</button></div></div><div class="bern-calendar-weekdays"><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span></div><div class="bern-calendar-grid" role="grid" aria-label="Bern month calendar" data-calendar-grid></div><div class="bern-calendar-footer"><span>Europe/Zurich · Monday first</span><button type="button" data-calendar-action="today">Today</button></div></section>
    - type: weather
      css-class: cc-rail-weather
      location: Bern, Switzerland
      units: metric
      hour-format: 24h
      show-area-name: false
    - type: custom-api
      title: Renovate · open PRs
      title-url: https://github.com/nikolanovoselec/komodo/pulls?q=is%3Apr+is%3Aopen+author%3Aapp%2Frenovate
      css-class: komodo-widget renovate-prs
      cache: 1m
      update-interval: 1m
      url: http://workload-summary:8090/summary
      template: '{{ if .JSON.String "renovate.error" }}<div class="k-warning">{{ .JSON.String "renovate.error" }}</div>{{ else }}<div class="renovate-count"><b>{{ .JSON.Int "renovate.count" }}</b><span>{{ if .JSON.Bool "renovate.truncated" }}loaded open PRs · partial list{{ else }}open Renovate PRs{{ end }}</span></div><div class="k-note">nikolanovoselec / komodo</div>{{ range .JSON.Array "renovate.prs" }}<a class="renovate-pr" href="{{ .String "url" }}" rel="noopener noreferrer"><small>#{{ .Int "number" }} <span>↗</span></small><strong>{{ .String "title" }}</strong></a>{{ else }}<div class="k-note">No open Renovate PRs</div>{{ end }}{{ end }}'
- name: NETWORKING
  slug: networking
  width: wide
  desktop-navigation-width: wide
  key-bind: d n
  columns:
  - size: full
    widgets:
    - type: custom-api
      title: Network
      css-class: networking-widget
      cache: 5s
      update-interval: 5s
      url: http://workload-summary:8090/network-current
      template: |
        <div class="nw-dashboard">
        {{ if .JSON.String "error" }}<p class="nw-warning" role="status">{{ .JSON.String "error" }}</p>{{ end }}
        {{ if .JSON.Bool "partial" }}<p class="nw-warning">Partial visibility · some network capabilities are unavailable.</p>{{ end }}
        {{ define "nw-device" }}<article class="nw-device {{ if eq (.String "kind") "gateway" }}nw-gateway{{ end }}"><header><div><span class="nw-eyebrow">{{ .String "kind" }}</span><h4>{{ if .String "url" }}<a href="{{ .String "url" }}" rel="noopener noreferrer">{{ .String "name" }} ↗</a>{{ else }}{{ .String "name" }}{{ end }}</h4></div><span class="nw-state {{ if ne (.String "state") "ONLINE" }}nw-warning{{ end }}">{{ .String "state" }}</span></header><p class="nw-meta">{{ .String "model" }}{{ if .String "ip" }} · {{ .String "ip" }}{{ end }}</p><div class="nw-metrics"><div class="nw-metric"><div class="nw-metric-label"><span>CPU</span><b>{{ if ne (.String "cpu_percent") "" }}{{ printf "%.1f" (.Float "cpu_percent") }}%{{ else }}Unavailable{{ end }}</b></div>{{ if and (gt (.Int "history.cpu.samples") 1) (.String "history.cpu.path") }}<svg viewBox="0 0 100 30" preserveAspectRatio="none" role="img" aria-label="CPU over the last 30 minutes"><path class="nw-gridline" d="M0 0 H100 M0 15 H100 M0 30 H100"/>{{ if .String "history.cpu.area_path" }}<path class="nw-area" d="{{ .String "history.cpu.area_path" }}"/>{{ end }}<path d="{{ .String "history.cpu.path" }}"/>{{ range .Array "history.cpu.dots" }}<circle cx="{{ .Float "x" }}" cy="{{ .Float "y" }}" r="0.7"/>{{ end }}</svg><div class="nw-axis"><span>−30m</span><span>0–{{ printf "%.1f" (.Float "history.cpu.scale") }}%</span><span>now</span></div>{{ else }}<p class="nw-no-history">{{ if eq (.String "history.cpu.state") "collecting" }}Collecting history{{ else }}History unavailable{{ end }}</p>{{ end }}</div><div class="nw-metric"><div class="nw-metric-label"><span>MEMORY</span><b>{{ if ne (.String "memory_percent") "" }}{{ printf "%.1f" (.Float "memory_percent") }}%{{ else }}Unavailable{{ end }}</b></div>{{ if and (gt (.Int "history.ram.samples") 1) (.String "history.ram.path") }}<svg viewBox="0 0 100 30" preserveAspectRatio="none" role="img" aria-label="MEMORY over the last 30 minutes"><path class="nw-gridline" d="M0 0 H100 M0 15 H100 M0 30 H100"/>{{ if .String "history.ram.area_path" }}<path class="nw-area" d="{{ .String "history.ram.area_path" }}"/>{{ end }}<path d="{{ .String "history.ram.path" }}"/>{{ range .Array "history.ram.dots" }}<circle cx="{{ .Float "x" }}" cy="{{ .Float "y" }}" r="0.7"/>{{ end }}</svg><div class="nw-axis"><span>−30m</span><span>0–{{ printf "%.1f" (.Float "history.ram.scale") }}%</span><span>now</span></div>{{ else }}<p class="nw-no-history">{{ if eq (.String "history.ram.state") "collecting" }}Collecting history{{ else }}History unavailable{{ end }}</p>{{ end }}</div><div class="nw-metric"><div class="nw-metric-label"><span>RX</span><b>{{ if ne (.String "rx_mbps") "" }}{{ printf "%.1f" (.Float "rx_mbps") }} Mbps{{ else }}Unavailable{{ end }}</b></div>{{ if and (gt (.Int "history.rx.samples") 1) (.String "history.rx.path") }}<svg viewBox="0 0 100 30" preserveAspectRatio="none" role="img" aria-label="RX over the last 30 minutes"><path class="nw-gridline" d="M0 0 H100 M0 15 H100 M0 30 H100"/>{{ if .String "history.rx.area_path" }}<path class="nw-area" d="{{ .String "history.rx.area_path" }}"/>{{ end }}<path d="{{ .String "history.rx.path" }}"/>{{ range .Array "history.rx.dots" }}<circle cx="{{ .Float "x" }}" cy="{{ .Float "y" }}" r="0.7"/>{{ end }}</svg><div class="nw-axis"><span>−30m</span><span>0–{{ printf "%.1f" (.Float "history.rx.scale") }} Mbps</span><span>now</span></div>{{ else }}<p class="nw-no-history">{{ if eq (.String "history.rx.state") "collecting" }}Collecting history{{ else }}History unavailable{{ end }}</p>{{ end }}</div><div class="nw-metric"><div class="nw-metric-label"><span>TX</span><b>{{ if ne (.String "tx_mbps") "" }}{{ printf "%.1f" (.Float "tx_mbps") }} Mbps{{ else }}Unavailable{{ end }}</b></div>{{ if and (gt (.Int "history.tx.samples") 1) (.String "history.tx.path") }}<svg viewBox="0 0 100 30" preserveAspectRatio="none" role="img" aria-label="TX over the last 30 minutes"><path class="nw-gridline" d="M0 0 H100 M0 15 H100 M0 30 H100"/>{{ if .String "history.tx.area_path" }}<path class="nw-area" d="{{ .String "history.tx.area_path" }}"/>{{ end }}<path d="{{ .String "history.tx.path" }}"/>{{ range .Array "history.tx.dots" }}<circle cx="{{ .Float "x" }}" cy="{{ .Float "y" }}" r="0.7"/>{{ end }}</svg><div class="nw-axis"><span>−30m</span><span>0–{{ printf "%.1f" (.Float "history.tx.scale") }} Mbps</span><span>now</span></div>{{ else }}<p class="nw-no-history">{{ if eq (.String "history.tx.state") "collecting" }}Collecting history{{ else }}History unavailable{{ end }}</p>{{ end }}</div></div><footer>{{ if ne (.String "ports_active") "" }}<span>Ports <b>{{ .Int "ports_active" }}{{ if ne (.String "ports_total") "" }}/{{ .Int "ports_total" }}{{ end }}</b></span>{{ end }}{{ if ne (.String "clients_count") "" }}<span>Clients <b>{{ .Int "clients_count" }}</b></span>{{ end }}{{ if ne (.String "uptime_seconds") "" }}<span>Uptime <b>{{ printf "%.1f" (div (.Float "uptime_seconds") 3600) }}h</b></span>{{ end }}</footer></article>{{ end }}
        <div class="nw-top-row"><section class="nw-pihole">
          {{ if .JSON.String "pihole.error" }}<div class="k-warning">{{ .JSON.String "pihole.error" }}</div>{{ end }}
          <article class="pve-node cc-resource-link pm-node">
          <header><strong>Pi-hole</strong><span class="k-state">{{ if .JSON.Bool "pihole.partial" }}Partial data{{ else if .JSON.Bool "pihole.available" }}● available{{ else }}Unavailable{{ end }}</span></header>
          <div class="pve-cpu"><span class="pve-label">TOTAL QUERIES</span><strong>{{ if .JSON.Bool "pihole.available" }}{{ .JSON.Int "pihole.total_queries" }}{{ else }}N/A{{ end }}</strong></div>
          <div class="pve-cpu"><span class="pve-label">BLOCKED</span><strong>{{ if .JSON.Bool "pihole.available" }}{{ .JSON.Int "pihole.blocked_queries" }}{{ else }}N/A{{ end }}</strong></div>
          <div class="pve-cpu"><span class="pve-label">BLOCKED RATE</span><strong>{{ if gt (.JSON.Int "pihole.total_queries") 0 }}{{ printf "%.1f" (mul (div (.JSON.Float "pihole.blocked_queries") (.JSON.Float "pihole.total_queries")) 100.0) }}<em>%</em>{{ else }}N/A{{ end }}</strong></div>
          <section class="pve-network"><span class="pve-label">REQUESTS <small>24h · all queries, including blocked</small></span>
          <svg class="pve-netgraph" viewBox="0 0 600 140" preserveAspectRatio="none" role="img" tabindex="0" aria-label="Requests, last 24 hours, queries per 10-minute bin"><title>10-minute query counts, UTC. Smooth display interpolation preserves recorded values; missing intervals are gaps, not zero.</title><path class="pve-gridline" d="M0 0 H600 M0 70 H600 M0 140 H600"/><defs><pattern id="pm-gap-requests" width="8" height="8" patternUnits="userSpaceOnUse"><path class="pm-hatch" d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6"/></pattern></defs>{{ range .JSON.Array "pihole.query_history.missing_spans" }}<rect class="pm-missing" x="{{ .Float "x" }}" y="0" width="{{ .Float "width" }}" height="140" fill="url(#pm-gap-requests)"/>{{ end }}<path class="pm-area pm-requests" d="{{ if .JSON.String "pihole.query_history.total.curve_area_path" }}{{ .JSON.String "pihole.query_history.total.curve_area_path" }}{{ else }}{{ .JSON.String "pihole.query_history.total.area_path" }}{{ end }}"/><path class="pve-rx" d="{{ if .JSON.String "pihole.query_history.total.curve_path" }}{{ .JSON.String "pihole.query_history.total.curve_path" }}{{ else }}{{ .JSON.String "pihole.query_history.total.path" }}{{ end }}"/></svg>
          <div class="pve-netaxis"><span>{{ .JSON.String "pihole.query_history.start" }} UTC</span><span>0–{{ .JSON.Int "pihole.query_history.total.bin_max_count" }} queries /10 min</span><span>{{ .JSON.String "pihole.query_history.end" }} UTC</span></div>
          </section>
          <section class="pve-network"><span class="pve-label">BLOCKS <small>24h · blocked subset</small></span>
          <svg class="pve-netgraph" viewBox="0 0 600 140" preserveAspectRatio="none" role="img" tabindex="0" aria-label="Blocks, last 24 hours, queries per 10-minute bin"><title>10-minute query counts, UTC. Smooth display interpolation preserves recorded values; missing intervals are gaps, not zero.</title><path class="pve-gridline" d="M0 0 H600 M0 70 H600 M0 140 H600"/><defs><pattern id="pm-gap-blocks" width="8" height="8" patternUnits="userSpaceOnUse"><path class="pm-hatch" d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6"/></pattern></defs>{{ range .JSON.Array "pihole.query_history.missing_spans" }}<rect class="pm-missing" x="{{ .Float "x" }}" y="0" width="{{ .Float "width" }}" height="140" fill="url(#pm-gap-blocks)"/>{{ end }}<path class="pm-area pm-blocks" d="{{ if .JSON.String "pihole.query_history.blocked.curve_area_path" }}{{ .JSON.String "pihole.query_history.blocked.curve_area_path" }}{{ else }}{{ .JSON.String "pihole.query_history.blocked.area_path" }}{{ end }}"/><path class="pve-tx" d="{{ if .JSON.String "pihole.query_history.blocked.curve_path" }}{{ .JSON.String "pihole.query_history.blocked.curve_path" }}{{ else }}{{ .JSON.String "pihole.query_history.blocked.path" }}{{ end }}"/></svg>
          <div class="pve-netaxis"><span>{{ .JSON.String "pihole.query_history.start" }} UTC</span><span>0–{{ .JSON.Int "pihole.query_history.blocked.bin_max_count" }} queries /10 min</span><span>{{ .JSON.String "pihole.query_history.end" }} UTC</span></div>
          </section>
          {{ if .JSON.Bool "pihole.partial" }}<p class="nw-warning pm-note">Partial totals · available instances only.</p>{{ end }}
          {{ if .JSON.Bool "pihole.query_history.stale" }}<p class="nw-warning pm-note">Query history is stale.</p>{{ end }}
          {{ if not (.JSON.Bool "pihole.query_history.available") }}<p class="nw-warning pm-note">Query history unavailable.</p>{{ end }}
          {{ if .JSON.Bool "pihole.query_history.partial" }}<p class="pm-note">Incomplete history · unavailable intervals are not zero.</p>{{ end }}
          {{ if .JSON.Array "pihole.query_history.missing_spans" }}<p class="pm-no-data">Hatched = no data, not zero.</p>{{ end }}
          <div class="pm-dns-config"><div><span class="pve-label">Blacklist</span><strong>{{ if .JSON.Bool "pihole.available" }}{{ .JSON.Int "pihole.gravity_entries" }}{{ else }}N/A{{ end }}</strong><small>{{ if .JSON.Bool "pihole.partial" }}entries from available instances{{ else }}entries across both instances{{ end }} · not deduplicated</small></div><div><span class="pve-label">Upstream DNS</span><div class="pm-upstream-list">{{ range .JSON.Array "pihole.configured_upstreams" }}<code>{{ .String "" }}</code>{{ else }}<span>{{ if .JSON.Bool "pihole.upstreams_available" }}None configured{{ else }}Unavailable{{ end }}</span>{{ end }}</div><small>Configured forwarders</small>{{ if not (.JSON.Bool "pihole.upstreams_available") }}<small class="nw-warning">Upstream configuration unavailable or partial.</small>{{ end }}{{ if .JSON.Bool "pihole.upstreams_partial" }}<small class="nw-warning">Configured forwarders incomplete · available instances only.</small>{{ end }}{{ if .JSON.Bool "pihole.upstreams_truncated" }}<small class="nw-warning">Upstream list incomplete.</small>{{ end }}</div></div>
          </article>
        </section>{{ range .JSON.Array "devices" }}{{ if eq (.String "kind") "gateway" }}{{ template "nw-device" . }}{{ end }}{{ end }}</div>
              <section class="nw-infrastructure"><div class="nw-section-heading"><h3>Infrastructure</h3><span>Last 30 minutes · device uplink RX / TX</span></div><div class="nw-devices"><section class="nw-group"><h3>Switches</h3>{{ range .JSON.Array "devices" }}{{ if eq (.String "kind") "switch" }}{{ template "nw-device" . }}{{ end }}{{ end }}</section><section class="nw-group"><h3>Access points</h3>{{ range .JSON.Array "devices" }}{{ if or (eq (.String "kind") "access-point") (eq (.String "kind") "ap") }}{{ template "nw-device" . }}{{ end }}{{ end }}</section><section class="nw-group"><h3>Internet backup</h3>{{ range .JSON.Array "devices" }}{{ if eq (.String "model") "U-LTE-Pro" }}{{ template "nw-device" . }}{{ end }}{{ end }}</section>{{ range .JSON.Array "devices" }}{{ if and (ne (.String "kind") "gateway") (ne (.String "kind") "switch") (ne (.String "kind") "access-point") (ne (.String "kind") "ap") (ne (.String "model") "U-LTE-Pro") }}{{ template "nw-device" . }}{{ end }}{{ else }}<p class="nw-empty">No device inventory available.</p>{{ end }}</div></section>
        </div>
- name: MEDIA
  slug: media
  width: wide
  desktop-navigation-width: wide
  key-bind: d m
  columns:
  - size: full
    widgets:
    - type: custom-api
      title: Plex Radio
      frameless: true
      css-class: plex-radio-widget
      cache: 30s
      update-interval: 30s
      url: http://radio:8091/radio/preview
      template: |
        <section class="plex-radio pr-server-preview" aria-label="Plex Radio" data-preview-error="{{ .JSON.String "error" }}" data-preview-id="{{ .JSON.String "track.id" }}" data-preview-codec="{{ .JSON.String "track.codec" }}">
          <button type="button" class="pr-dismiss" data-action="dismiss" aria-label="Dismiss mini player" title="Hide mini player; music keeps playing" hidden>×</button>
          <header class="pr-heading"><span>PLEX RADIO</span><span class="pr-mode">YOUR MUSIC · ON SHUFFLE</span></header>
          <div class="pr-body"><div class="pr-art"><span aria-hidden="true">♫</span>{{ if .JSON.String "poster_base64" }}<img alt="" src="data:image/jpeg;base64,{{ .JSON.String "poster_base64" }}">{{ else }}<img alt="" hidden>{{ end }}</div>
            <div class="pr-info"><h3 class="pr-title">{{ if .JSON.String "track.id" }}{{ .JSON.String "track.title" }}{{ else }}Let your library play{{ end }}</h3><p class="pr-artist">{{ if .JSON.String "track.id" }}{{ .JSON.String "track.artist" }}{{ else }}A little discovery, from your own collection.{{ end }}</p><p class="pr-album">{{ .JSON.String "track.album" }}</p>
              <div class="pr-controls"><button type="button" data-action="previous" aria-label="Previous track" disabled>⏮</button><button type="button" data-action="play" class="pr-play">Play</button><button type="button" data-action="next" aria-label="Next track" disabled>⏭</button><button type="button" data-action="shuffle" title="Play a random track">Shuffle</button></div>
            </div>
          </div>
          <div class="pr-sliders"><div class="pr-seek"><label for="pr-seek">Seek</label><input id="pr-seek" type="range" min="0" max="0" step="1" value="0" disabled><span class="pr-time">0:00 / 0:00</span></div><div class="pr-volume"><label for="pr-volume">Volume</label><input id="pr-volume" type="range" min="0" max="100" step="1" value="100" aria-valuetext="100%"></div></div>
          <p class="pr-status" role="status" aria-live="polite">{{ if .JSON.String "error" }}{{ .JSON.String "error" }} · {{ end }}Press Play to begin. Audio stays off until you do.</p>
        </section>
    - type: custom-api
      title: Media
      frameless: true
      css-class: media-ops-widget
      cache: 1s
      update-interval: 1s
      url: http://workload-summary:8090/media-current
      template: '<div class="mo-page mo-live">

        <div class="mo-head"><div><span class="mo-eyebrow">THE SCREENING ROOM</span><h2>Media</h2><p>Playback, libraries and delivery — one live view.</p></div><span class="mo-live-label"><i></i> LIVE OPERATIONS</span></div>

        {{ if .JSON.String "sessions.error" }}<div class="mo-notice">{{ .JSON.String "sessions.error" }} · DYNACAT_PLEX_TOKEN must be available to the collector.</div>{{ else }}

        <div class="mo-kpis"><div><b>{{ .JSON.Int "sessions.data.count" }}</b><span>Concurrent streams</span></div><div><b>{{ .JSON.Int "sessions.data.direct" }}</b><span>Direct play</span></div><div><b>{{ .JSON.Int "sessions.data.transcoding" }}</b><span>Transcoding</span></div><div><b>{{ if .JSON.Bool "sessions.data.has_bandwidth" }}{{ .JSON.Float "sessions.data.bandwidth_mbps" }}<small> Mbps</small>{{ else }}—{{ end }}</b><span>Plex reserved bandwidth · {{ .JSON.Int "sessions.data.bandwidth_coverage" }}/{{ .JSON.Int "sessions.data.count" }} streams reported</span></div></div>

        {{ if not (.JSON.String "resources.error") }}<section class="mo-traffic" aria-label="Media host network bandwidth"><div class="mo-traffic-heading"><div><span class="mo-eyebrow">NETWORK ACTIVITY</span><h3>Media host bandwidth</h3><small>All interfaces · sampled interval rates, not per-app traffic</small></div>{{ if eq (.JSON.String "resources.data.traffic.state") "stale" }}<span class="mo-traffic-freshness">Data is stale</span>{{ else if eq (.JSON.String "resources.data.traffic.state") "unavailable" }}<span class="mo-traffic-freshness">Data unavailable</span>{{ end }}</div><div class="mo-traffic-rates"><div class="mo-rx"><span>↓ Receive</span><b>{{ if .JSON.Bool "resources.data.traffic.available" }}{{ .JSON.Float "resources.data.traffic.rx_mbps" | printf "%.2f" }}{{ else }}—{{ end }} <small>Mbps</small></b></div><div class="mo-tx"><span>↑ Transmit</span><b>{{ if .JSON.Bool "resources.data.traffic.available" }}{{ .JSON.Float "resources.data.traffic.tx_mbps" | printf "%.2f" }}{{ else }}—{{ end }} <small>Mbps</small></b></div></div><div class="mo-traffic-plot"><span class="mo-traffic-scale">{{ .JSON.Float "resources.data.traffic.graph.scale_mbps" }} Mbps</span><svg viewBox="0 0 600 100" preserveAspectRatio="none" role="img" aria-label="Receive solid line and transmit dashed line, shared Mbps scale, thirty-minute window"><path class="mo-traffic-grid" d="M0 0H600 M0 50H600 M0 100H600 M150 0V100 M300 0V100 M450 0V100"/>{{ range .JSON.Array "resources.data.traffic.graph.series" }}<g class="mo-traffic-{{ .String "key" }}"><path d="{{ .String "path" }}"/>{{ range .Array "points" }}<circle cx="{{ .Float "x" }}" cy="{{ .Float "y" }}" r="1.5"/>{{ end }}</g>{{ end }}</svg>{{ if .JSON.Bool "resources.data.traffic.warmup" }}<span class="mo-traffic-warmup">Collecting real samples · history starts now</span>{{ end }}</div><div class="mo-traffic-axis"><span>−30 min</span><span>−15 min</span><span>Now</span></div><div class="mo-traffic-foot"><small>{{ .JSON.Int "resources.data.traffic.graph.samples" }} real samples · {{ .JSON.Int "resources.data.traffic.graph.span_seconds" }}s observed · gaps ≥30s are not connected</small><small>Komodo / Periphery · {{ if eq (.JSON.String "resources.data.traffic.persistence_state") "ready" }}restart-safe history{{ else }}history storage unavailable{{ end }}</small></div></section>{{ end }}

        <div class="mo-section"><h3>Now playing</h3><small><a href="https://db-ip.com" rel="noopener noreferrer">IP Geolocation by DB-IP</a></small></div>

        <div class="mo-players">{{ range $index, $session := .JSON.Array "sessions.data.streams" }}<article class="mo-player">{{ if .String "plex_url" }}<a class="mo-player-link" href="{{ .String "plex_url" }}" rel="noopener noreferrer" aria-label="Open {{ .String "title" }} {{ .String "subtitle" }} in Plex">{{ else }}<div class="mo-player-link">{{ end }}<div class="mo-player-art">{{ if .String "poster" }}<img src="data:image/jpeg;base64,{{ .String "poster" }}" alt="{{ .String "title" }} poster" width="200" height="300">{{ else }}<span class="mo-art-placeholder">{{ .String "type" }}</span>{{ end }}</div><div class="mo-player-info"><div class="mo-session-viewer"><span class="mo-session-user-label">USER</span><strong>{{ if .String "user" }}{{ .String "user" }}{{ else }}Unknown viewer{{ end }}</strong><span title="Approximate network location, not a precise viewer location. VPN, mobile and proxy exits may differ.">{{ if .String "geo_label" }}{{ .String "geo_label" }}{{ else }}Location unavailable{{ end }} · {{ if eq (.String "location") "wan" }}WAN{{ else if eq (.String "location") "lan" }}LAN{{ else }}Network unknown{{ end }}</span></div><h3>{{ .String "title" }} ↗</h3><p>{{ .String "subtitle" }}</p><div class="mo-session-origin">{{ if .String "player" }}{{ .String "player" }}{{ else }}Device unknown{{ end }}</div><div class="mo-player-top"><span class="mo-badge">{{ .String "state" }}</span><span>{{ .String "mode" }}</span><span class="mo-session-bandwidth">{{ if .Exists "bandwidth_kbps" }}{{ if ne (.String "bandwidth_kbps") "" }}{{ .Int "bandwidth_kbps" }} kbps{{ else }}BW —{{ end }}{{ else }}BW —{{ end }}</span></div><div class="mo-progress" aria-label="Playback {{ .Float "progress" | printf "%.0f" }} percent"><i style="width:{{ .Float "progress" }}%"></i></div></div>{{ if .String "plex_url" }}</a>{{ else }}</div>{{ end }}<div class="mo-session-meta"><button type="button" popovertarget="mo-session-info-{{ $index }}" aria-label="Session information for {{ .String "title" }}">ⓘ</button><div class="mo-session-tooltip" id="mo-session-info-{{ $index }}" popover><strong>{{ .String "title" }} · {{ .String "subtitle" }}</strong><p>{{ .String "user" }} · {{ .String "player" }}</p><p>{{ .String "resolution" }} · {{ .Float "progress" | printf "%.0f" }}% · {{ .String "location" }}</p><small>Bandwidth: Plex reserved, not measured throughput.</small>{{ if not (.String "plex_url") }}<p>Exact Plex link unavailable</p>{{ end }}{{ if .String "imdb" }}<a class="mo-imdb" href="{{ .String "imdb" }}" rel="noopener noreferrer">IMDb ↗</a>{{ end }}</div></div></article>{{ else }}<div class="mo-idle"><span>Ⅱ</span><div><h3>The room is quiet</h3><p>Plex reports no active playback. New sessions appear here automatically.</p></div></div>{{ end }}</div>{{ end }}

        <div class="mo-section"><h3>Media servers</h3></div>

        {{ if .JSON.String "resources.error" }}<div class="mo-notice">{{ .JSON.String "resources.error" }}</div>{{ else }}<div class="mo-servers">{{ range .JSON.Array "resources.data.servers" }}<a class="mo-server" href="{{ .String "url" }}" rel="noopener noreferrer"><div class="mo-server-title"><h3>{{ .String "name" }}</h3><span class="mo-state mo-state-{{ if .Bool "disabled" }}disabled{{ else }}{{ .String "state" }}{{ end }}">{{ if .Bool "disabled" }}disabled · {{ end }}{{ .String "state" }}</span></div><div class="mo-server-metrics"><div><small>CPU · Docker</small><b>{{ if .Bool "has_cpu" }}{{ .Float "cpu" | printf "%.2f" }}%{{ else }}—{{ end }}</b></div><div><small>RAM · container</small><b>{{ .String "ram" }}</b></div></div><p>{{ .String "status" }}</p><small>Network: {{ .String "bandwidth" }}</small></a>{{ end }}</div>{{ end }}

        </div>'
    - type: custom-api
      title: Plex library
      frameless: true
      css-class: media-ops-widget
      cache: 10s
      update-interval: 10s
      url: http://workload-summary:8090/media-library
      template: <div class="mo-page"><div class="mo-section"><h3>Library pulse</h3></div>{{ if .JSON.String "library.error" }}<div class="mo-notice">{{ .JSON.String "library.error" }}</div>{{ else }}<div class="mo-libraries">{{ range .JSON.Array "library.data.libraries" }}<div><b>{{ .Int "total" }}</b><span>{{ .String "title" }}</span><small>{{ .String "type" }} library items</small></div>{{ end }}</div><div class="mo-section"><h3>Fresh on Plex</h3><small>Latest movies & episodes · newest first</small></div><div class="mo-posters">{{ range .JSON.Array "library.data.recent" }}<article class="mo-poster">{{ if .String "url" }}<a class="mo-poster-link" href="{{ .String "url" }}" rel="noopener noreferrer" aria-label="Open {{ .String "title" }} {{ .String "subtitle" }}">{{ end }}<div class="mo-art">{{ if .String "poster" }}<img src="data:image/jpeg;base64,{{ .String "poster" }}" alt="{{ .String "title" }} poster" loading="lazy" width="200" height="300">{{ else }}<span class="mo-art-placeholder">{{ .String "type" }}</span>{{ end }}<span class="mo-art-type">{{ .String "type" }}</span></div>{{ if .String "url" }}</a>{{ end }}<h3>{{ if .String "url" }}<a class="mo-item-title" href="{{ .String "url" }}" rel="noopener noreferrer">{{ .String "title" }} ↗</a>{{ else }}{{ .String "title" }}{{ end }}{{ if .String "imdb" }} <a class="mo-imdb" href="{{ .String "imdb" }}" rel="noopener noreferrer">IMDb ↗</a>{{ end }}</h3><p>{{ .String "subtitle" }}</p><small>{{ .String "library" }} · <span data-dynamic-relative-time="{{ .Int "added_at" }}"></span></small></article>{{ else }}<p class="mo-notice">Plex returned no recent video additions.</p>{{ end }}</div>{{ end }}</div>{{ if .JSON.String "library.error" }}<div class="mo-page"><div class="mo-section"><h3>Just landed</h3><small>Verified Sonarr / Radarr imports · not Plex membership</small></div>{{ if .JSON.String "imports.error" }}<div class="mo-notice">{{ .JSON.String "imports.error" }}</div>{{ else }}<div class="mo-posters">{{ range .JSON.Array "imports.data.recent" }}<article class="mo-poster">{{ if .String "url" }}<a class="mo-poster-link" href="{{ .String "url" }}" rel="noopener noreferrer" aria-label="Open {{ .String "title" }} {{ .String "subtitle" }}">{{ end }}<div class="mo-art">{{ if .String "poster" }}<img src="data:image/jpeg;base64,{{ .String "poster" }}" alt="{{ .String "title" }} poster" loading="lazy" width="200" height="300">{{ else }}<span class="mo-art-placeholder">{{ .String "type" }}</span>{{ end }}<span class="mo-art-type">{{ .String "type" }}</span></div>{{ if .String "url" }}</a>{{ end }}<h3>{{ if .String "url" }}<a class="mo-item-title" href="{{ .String "url" }}" rel="noopener noreferrer">{{ .String "title" }} ↗</a>{{ else }}{{ .String "title" }}{{ end }}{{ if .String "imdb" }} <a class="mo-imdb" href="{{ .String "imdb" }}" rel="noopener noreferrer">IMDb ↗</a>{{ end }}</h3><p>{{ .String "subtitle" }}</p><small>{{ .String "library" }} · <span data-dynamic-relative-time="{{ .Int "added_at" }}"></span></small></article>{{ else }}<p class="mo-notice">No recent imports returned.</p>{{ end }}</div>{{ end }}</div>{{ end }}
  - size: small
