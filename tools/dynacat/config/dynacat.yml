      frameless: true
      css-class: media-ops-widget
      cache: 1s
      update-interval: 1s
      url: http://workload-summary:8090/media-current
      template: <div class="mo-page mo-delivery"><div class="mo-section"><h3><a href="https://qbittorrent.graymatter.ch/#/" target="_blank" rel="noopener noreferrer">qBittorrent ↗</a></h3><small>Read API · {{ .JSON.Int "qbittorrent.age" }}s ago · cache 5s</small></div>{{ if .JSON.String "qbittorrent.error" }}<div class="mo-notice">{{ .JSON.String "qbittorrent.error" }}</div>{{ else }}<div class="mo-server-metrics"><div><small>↓ Download</small><b>{{ .JSON.Float "qbittorrent.data.download_mbps" }} Mbps</b></div><div><small>↑ Upload</small><b>{{ .JSON.Float "qbittorrent.data.upload_mbps" }} Mbps</b></div></div><p class="mo-empty"><a href="{{ .JSON.String "qbittorrent.data.url" }}" target="_blank" rel="noopener noreferrer">{{ .JSON.String "qbittorrent.data.state" }} · measured transfer rates ↗</a></p>{{ range .JSON.Array "qbittorrent.data.downloads" }}<article class="mo-download"><a href="{{ .String "url" }}" target="_blank" rel="noopener noreferrer"><strong>{{ .String "title" }} ↗</strong></a><div class="mo-progress"><i style="width:{{ .Float "progress" }}%"></i></div><small>{{ .String "state" }} · {{ .Float "progress" }}% · {{ .Float "remaining_gb" }} GB left</small></article>{{ else }}<p class="mo-empty">No downloads in qBittorrent's downloading filter. Seeding is not a stalled download.</p>{{ end }}{{ if .JSON.Bool "qbittorrent.data.bounded" }}<small>Showing up to 12 downloading entries.</small>{{ end }}{{ end }}</div>
    - type: custom-api
