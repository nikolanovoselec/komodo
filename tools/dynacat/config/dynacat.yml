    - type: custom-api
      title: qBittorrent
      frameless: true
      css-class: media-ops-widget
      cache: 1s
      update-interval: 1s
      url: http://workload-summary:8090/media-current
      template: <div class="mo-page mo-delivery"><div class="mo-section"><h3><a href="https://qbittorrent.graymatter.ch/#/" rel="noopener noreferrer">qBittorrent ↗</a></h3></div>{{ if .JSON.String "qbittorrent.error" }}<div class="mo-notice">{{ .JSON.String "qbittorrent.error" }}</div>{{ else }}<div class="mo-server-metrics"><div><small>↓ Download</small><b>{{ .JSON.Float "qbittorrent.data.download_mbps" }} Mbps</b></div><div><small>↑ Upload</small><b>{{ .JSON.Float "qbittorrent.data.upload_mbps" }} Mbps</b></div></div><p class="mo-empty"><a href="{{ .JSON.String "qbittorrent.data.url" }}" rel="noopener noreferrer">{{ .JSON.String "qbittorrent.data.state" }} · measured transfer rates ↗</a></p>{{ range .JSON.Array "qbittorrent.data.downloads" }}<article class="mo-download"><a href="{{ .String "url" }}" rel="noopener noreferrer"><strong>{{ .String "title" }} ↗</strong></a><div class="mo-progress"><i style="width:{{ .Float "progress" }}%"></i></div><small>{{ .String "state" }} · {{ .Float "progress" }}% · {{ .Float "remaining_gb" }} GB left</small></article>{{ else }}<p class="mo-empty">No downloads in qBittorrent's downloading filter. Seeding is not a stalled download.</p>{{ end }}{{ if .JSON.Bool "qbittorrent.data.bounded" }}<small>Showing up to 12 downloading entries.</small>{{ end }}{{ end }}</div>
    - type: custom-api
      title: Sonarr delivery
      frameless: true
      css-class: media-ops-widget
      cache: 10s
      update-interval: 10s
      url: http://workload-summary:8090/media-arr
      template: <div class="mo-page mo-delivery mo-arr-delivery"><div class="mo-section"><h3><a href="https://sonarr.graymatter.ch/" rel="noopener noreferrer">Sonarr ↗</a></h3>{{ if not (.JSON.String "sonarr.error") }}<span class="mo-queue-state">{{ .JSON.Int "sonarr.data.total" }} queued</span>{{ end }}</div>{{ if .JSON.String "sonarr.error" }}<div class="mo-notice">{{ .JSON.String "sonarr.error" }}</div>{{ else }}{{ range .JSON.Array "sonarr.data.queue" }}<article class="mo-download"><div><strong>{{ if .String "url" }}<a class="mo-item-title" aria-label="Open {{ .String "title" }} in Sonarr" href="{{ .String "url" }}" rel="noopener noreferrer">{{ .String "title" }} ↗</a>{{ else }}{{ .String "title" }}<span class="mo-source-unavailable">Source link unavailable</span>{{ end }}{{ if .String "imdb" }} <a class="mo-imdb mo-arr-thumb" aria-label="IMDb for {{ .String "title" }}" title="View {{ .String "title" }} on IMDb" href="{{ .String "imdb" }}" rel="noopener noreferrer">{{ if .String "poster" }}{{ if eq (.String "poster_mime") "image/png" }}<img src="data:image/png;base64,{{ .String "poster" }}"{{ else }}<img src="data:image/jpeg;base64,{{ .String "poster" }}"{{ end }} alt="Poster for {{ .String "title" }}" width="44" height="66" loading="lazy">{{ else }}<span class="mo-arr-thumb-fallback">IMDb<span>Poster unavailable</span></span>{{ end }}</a>{{ end }}</strong><span class="mo-download-progress">{{ .Float "progress" }}%</span></div><div class="mo-progress"><i style="width:{{ .Float "progress" }}%"></i></div><div class="mo-download-meta"><span class="mo-download-status">{{ .String "status" }} · {{ .String "tracked" }}</span><span>{{ .Float "remaining_gb" }} GB left</span><span>ETA {{ if .String "eta" }}{{ .String "eta" }}{{ else }}unavailable{{ end }}</span></div></article>{{ else }}<p class="mo-empty">No active downloads</p>{{ end }}{{ if .JSON.Bool "sonarr.data.truncated" }}<p class="mo-notice">Showing first 30 queued items.</p>{{ end }}<div class="mo-recent-heading">Recently imported</div><div class="mo-recent-preview">{{ range $index, $item := .JSON.Array "sonarr.data.recent" }}{{ if lt $index 3 }}<article class="mo-import"><div><h4>{{ if .String "url" }}<a class="mo-item-title" aria-label="Open {{ .String "title" }} in Sonarr" href="{{ .String "url" }}" rel="noopener noreferrer">{{ .String "title" }} ↗</a>{{ else }}{{ .String "title" }}<span class="mo-source-unavailable">Source link unavailable</span>{{ end }}{{ if .String "imdb" }} <a class="mo-imdb mo-arr-thumb" aria-label="IMDb for {{ .String "title" }}" title="View {{ .String "title" }} on IMDb" href="{{ .String "imdb" }}" rel="noopener noreferrer">{{ if .String "poster" }}{{ if eq (.String "poster_mime") "image/png" }}<img src="data:image/png;base64,{{ .String "poster" }}"{{ else }}<img src="data:image/jpeg;base64,{{ .String "poster" }}"{{ end }} alt="Poster for {{ .String "title" }}" width="44" height="66" loading="lazy">{{ else }}<span class="mo-arr-thumb-fallback">IMDb<span>Poster unavailable</span></span>{{ end }}</a>{{ end }}</h4><p>{{ .String "subtitle" }}</p><div class="mo-import-meta"><span>{{ .String "quality" }}</span><time datetime="{{ .String "date" }}">{{ .String "date" }}</time></div></div></article>{{ end }}{{ else }}<p class="mo-empty">No recent imports</p>{{ end }}</div>{{ if gt (len (.JSON.Array "sonarr.data.recent")) 3 }}<details class="mo-imports"><summary><span>More history</span><span class="mo-history-count">{{ len (slice (.JSON.Array "sonarr.data.recent") 3) }} more <span aria-hidden="true">⌄</span></span></summary>{{ range $index, $item := .JSON.Array "sonarr.data.recent" }}{{ if ge $index 3 }}<article class="mo-import"><div><h4>{{ if .String "url" }}<a class="mo-item-title" aria-label="Open {{ .String "title" }} in Sonarr" href="{{ .String "url" }}" rel="noopener noreferrer">{{ .String "title" }} ↗</a>{{ else }}{{ .String "title" }}<span class="mo-source-unavailable">Source link unavailable</span>{{ end }}{{ if .String "imdb" }} <a class="mo-imdb mo-arr-thumb" aria-label="IMDb for {{ .String "title" }}" title="View {{ .String "title" }} on IMDb" href="{{ .String "imdb" }}" rel="noopener noreferrer">{{ if .String "poster" }}{{ if eq (.String "poster_mime") "image/png" }}<img src="data:image/png;base64,{{ .String "poster" }}"{{ else }}<img src="data:image/jpeg;base64,{{ .String "poster" }}"{{ end }} alt="Poster for {{ .String "title" }}" width="44" height="66" loading="lazy">{{ else }}<span class="mo-arr-thumb-fallback">IMDb<span>Poster unavailable</span></span>{{ end }}</a>{{ end }}</h4><p>{{ .String "subtitle" }}</p><div class="mo-import-meta"><span>{{ .String "quality" }}</span><time datetime="{{ .String "date" }}">{{ .String "date" }}</time></div></div></article>{{ end }}{{ end }}</details>{{ end }}{{ end }}</div>
    - type: custom-api
      title: Radarr delivery
      frameless: true
      css-class: media-ops-widget
      cache: 10s
      update-interval: 10s
      url: http://workload-summary:8090/media-arr
      template: <div class="mo-page mo-delivery mo-arr-delivery"><div class="mo-section"><h3><a href="https://radarr.graymatter.ch/" rel="noopener noreferrer">Radarr ↗</a></h3>{{ if not (.JSON.String "radarr.error") }}<span class="mo-queue-state">{{ .JSON.Int "radarr.data.total" }} queued</span>{{ end }}</div>{{ if .JSON.String "radarr.error" }}<div class="mo-notice">{{ .JSON.String "radarr.error" }}</div>{{ else }}{{ range .JSON.Array "radarr.data.queue" }}<article class="mo-download"><div><strong>{{ if .String "url" }}<a class="mo-item-title" aria-label="Open {{ .String "title" }} in Radarr" href="{{ .String "url" }}" rel="noopener noreferrer">{{ .String "title" }} ↗</a>{{ else }}{{ .String "title" }}<span class="mo-source-unavailable">Source link unavailable</span>{{ end }}{{ if .String "imdb" }} <a class="mo-imdb mo-arr-thumb" aria-label="IMDb for {{ .String "title" }}" title="View {{ .String "title" }} on IMDb" href="{{ .String "imdb" }}" rel="noopener noreferrer">{{ if .String "poster" }}{{ if eq (.String "poster_mime") "image/png" }}<img src="data:image/png;base64,{{ .String "poster" }}"{{ else }}<img src="data:image/jpeg;base64,{{ .String "poster" }}"{{ end }} alt="Poster for {{ .String "title" }}" width="44" height="66" loading="lazy">{{ else }}<span class="mo-arr-thumb-fallback">IMDb<span>Poster unavailable</span></span>{{ end }}</a>{{ end }}</strong><span class="mo-download-progress">{{ .Float "progress" }}%</span></div><div class="mo-progress"><i style="width:{{ .Float "progress" }}%"></i></div><div class="mo-download-meta"><span class="mo-download-status">{{ .String "status" }} · {{ .String "tracked" }}</span><span>{{ .Float "remaining_gb" }} GB left</span><span>ETA {{ if .String "eta" }}{{ .String "eta" }}{{ else }}unavailable{{ end }}</span></div></article>{{ else }}<p class="mo-empty">No active downloads</p>{{ end }}{{ if .JSON.Bool "radarr.data.truncated" }}<p class="mo-notice">Showing first 30 queued items.</p>{{ end }}<div class="mo-recent-heading">Recently imported</div><div class="mo-recent-preview">{{ range $index, $item := .JSON.Array "radarr.data.recent" }}{{ if lt $index 3 }}<article class="mo-import"><div><h4>{{ if .String "url" }}<a class="mo-item-title" aria-label="Open {{ .String "title" }} in Radarr" href="{{ .String "url" }}" rel="noopener noreferrer">{{ .String "title" }} ↗</a>{{ else }}{{ .String "title" }}<span class="mo-source-unavailable">Source link unavailable</span>{{ end }}{{ if .String "imdb" }} <a class="mo-imdb mo-arr-thumb" aria-label="IMDb for {{ .String "title" }}" title="View {{ .String "title" }} on IMDb" href="{{ .String "imdb" }}" rel="noopener noreferrer">{{ if .String "poster" }}{{ if eq (.String "poster_mime") "image/png" }}<img src="data:image/png;base64,{{ .String "poster" }}"{{ else }}<img src="data:image/jpeg;base64,{{ .String "poster" }}"{{ end }} alt="Poster for {{ .String "title" }}" width="44" height="66" loading="lazy">{{ else }}<span class="mo-arr-thumb-fallback">IMDb<span>Poster unavailable</span></span>{{ end }}</a>{{ end }}</h4><p>{{ .String "subtitle" }}</p><div class="mo-import-meta"><span>{{ .String "quality" }}</span><time datetime="{{ .String "date" }}">{{ .String "date" }}</time></div></div></article>{{ end }}{{ else }}<p class="mo-empty">No recent imports</p>{{ end }}</div>{{ if gt (len (.JSON.Array "radarr.data.recent")) 3 }}<details class="mo-imports"><summary><span>More history</span><span class="mo-history-count">{{ len (slice (.JSON.Array "radarr.data.recent") 3) }} more <span aria-hidden="true">⌄</span></span></summary>{{ range $index, $item := .JSON.Array "radarr.data.recent" }}{{ if ge $index 3 }}<article class="mo-import"><div><h4>{{ if .String "url" }}<a class="mo-item-title" aria-label="Open {{ .String "title" }} in Radarr" href="{{ .String "url" }}" rel="noopener noreferrer">{{ .String "title" }} ↗</a>{{ else }}{{ .String "title" }}<span class="mo-source-unavailable">Source link unavailable</span>{{ end }}{{ if .String "imdb" }} <a class="mo-imdb mo-arr-thumb" aria-label="IMDb for {{ .String "title" }}" title="View {{ .String "title" }} on IMDb" href="{{ .String "imdb" }}" rel="noopener noreferrer">{{ if .String "poster" }}{{ if eq (.String "poster_mime") "image/png" }}<img src="data:image/png;base64,{{ .String "poster" }}"{{ else }}<img src="data:image/jpeg;base64,{{ .String "poster" }}"{{ end }} alt="Poster for {{ .String "title" }}" width="44" height="66" loading="lazy">{{ else }}<span class="mo-arr-thumb-fallback">IMDb<span>Poster unavailable</span></span>{{ end }}</a>{{ end }}</h4><p>{{ .String "subtitle" }}</p><div class="mo-import-meta"><span>{{ .String "quality" }}</span><time datetime="{{ .String "date" }}">{{ .String "date" }}</time></div></div></article>{{ end }}{{ end }}</details>{{ end }}{{ end }}</div>
