document:
  head: '<link rel="stylesheet" href="/assets/workload-docker.css"><link rel="stylesheet" href="/assets/endpoints.css"><script src="/assets/endpoints.js" defer></script><script src="/assets/bern-calendar.js" defer></script><link rel="stylesheet" href="/assets/bern-calendar.css"><script src="/assets/workload-docker.js" defer></script><link rel="stylesheet" href="/assets/media-ops.css"><script src="/assets/media-ops.js" defer></script><script src="/assets/local-theme.js"></script><script src="/assets/command-center.js" defer></script>'
server:
  port: 8080
  assets-path: /app/assets
  cache-dir: /app/assets/.cache
  allow-editing: false
  proxied: true
branding:
  app-name: Gray Matter Command Center
  hide-logo: false
  custom-footer: <span>Gray Matter · private operational workspace</span>
  logo-text: The Construct
  hide-footer: true
  show-desktop-navigation-on-hover: false
  center-desktop-navigation: true
