- name: Media Ops
  slug: media-ops
  name-icon: mdi:play-circle
  width: wide
  desktop-navigation-width: wide
  key-bind: d m
  columns:
  - size: full
    widgets:
    - type: custom-api
      title: Media Ops
      frameless: true
      css-class: media-ops-widget
      cache: 1s
      update-interval: 1s
      url: http://workload-summary:8090/media-current
      template: "<div class=\"mo-page mo-live\">\n<div class=\"mo-head\"><div><span class=\"mo-eyebrow\">THE SCREENING ROOM</span><h2>Media Ops</h2><p>Playback,\
        \ libraries and delivery \u2014 one live view.</p></div><span class=\"mo-live-label\"><i></i> LIVE OPERATIONS</span></div>\n{{ if .JSON.String\
        \ \"sessions.error\" }}<div class=\"mo-notice\">{{ .JSON.String \"sessions.error\" }} \xB7 DYNACAT_PLEX_TOKEN must be available to the\
        \ collector.</div>{{ else }}\n<div class=\"mo-kpis\"><div><b>{{ .JSON.Int \"sessions.data.count\" }}</b><span>Concurrent streams</span></div><div><b>{{\
        \ .JSON.Int \"sessions.data.direct\" }}</b><span>Direct play</span></div><div><b>{{ .JSON.Int \"sessions.data.transcoding\" }}</b><span>Transcoding</span></div><div><b>{{\
        \ if .JSON.Bool \"sessions.data.has_bandwidth\" }}{{ .JSON.Float \"sessions.data.bandwidth_mbps\" }}<small> Mbps</small>{{ else }}\u2014\
        {{ end }}</b><span>Plex reserved bandwidth</span></div></div>\n<div class=\"mo-section\"><h3>Now playing</h3><small>Plex sessions \xB7\
        \ {{ .JSON.Int \"sessions.age\" }}s since collection \xB7 UI 1s / source cache 5s</small></div>\n<div class=\"mo-players\">{{ range .JSON.Array\
        \ \"sessions.data.streams\" }}<article class=\"mo-player\"><div class=\"mo-player-top\"><span class=\"mo-badge\">{{ .String \"state\"\
        \ }}</span><span>{{ .String \"mode\" }} \xB7 {{ .String \"resolution\" }}</span></div><h3>{{ if .String \"imdb\" }}<a href=\"{{ .String\
        \ \"imdb\" }}\" target=\"_blank\" rel=\"noopener noreferrer\">{{ .String \"title\" }} \u2197</a>{{ else }}{{ .String \"title\" }}{{ end\
        \ }}</h3><p>{{ .String \"subtitle\" }}</p><div class=\"mo-progress\"><i style=\"width:{{ .Float \"progress\" }}%\"></i></div><div class=\"\
        mo-player-bottom\"><span>{{ .String \"user\" }} \xB7 {{ .String \"player\" }}</span><span>{{ .Float \"progress\" | printf \"%.0f\" }}%\
        \ \xB7 {{ .String \"location\" }}</span></div></article>{{ else }}<div class=\"mo-idle\"><span>\u2161</span><div><h3>The room is quiet</h3><p>Plex\
        \ reports no active playback. New sessions appear here automatically.</p></div></div>{{ end }}</div>{{ end }}\n<div class=\"mo-section\"\
        ><h3>Media servers</h3><small>Komodo / Docker \xB7 {{ .JSON.Int \"resources.age\" }}s since collection</small></div>\n{{ if .JSON.String\
        \ \"resources.error\" }}<div class=\"mo-notice\">{{ .JSON.String \"resources.error\" }}</div>{{ else }}<div class=\"mo-servers\">{{ range\
        \ .JSON.Array \"resources.data.servers\" }}<a class=\"mo-server\" href=\"{{ .String \"url\" }}\" target=\"_blank\" rel=\"noopener noreferrer\"\
        ><div class=\"mo-server-title\"><h3>{{ .String \"name\" }}</h3><span class=\"mo-state mo-state-{{ if .Bool \"disabled\" }}disabled{{ else\
        \ }}{{ .String \"state\" }}{{ end }}\">{{ if .Bool \"disabled\" }}disabled \xB7 {{ end }}{{ .String \"state\" }}</span></div><div class=\"\
        mo-server-metrics\"><div><small>CPU \xB7 Docker</small><b>{{ if .Bool \"has_cpu\" }}{{ .Float \"cpu\" | printf \"%.2f\" }}%{{ else }}\u2014\
        {{ end }}</b></div><div><small>RAM \xB7 container</small><b>{{ .String \"ram\" }}</b></div></div><p>{{ .String \"status\" }}</p><small>Network:\
        \ {{ .String \"bandwidth\" }}</small></a>{{ end }}</div><div class=\"mo-host-traffic\"><span>Media host \xB7 all interfaces \xB7 last\
        \ {{ .JSON.String \"resources.data.traffic.interval\" }} poll</span><b>{{ if .JSON.Bool \"resources.data.traffic.available\" }}\u2193\
        \ {{ .JSON.Float \"resources.data.traffic.rx_kb\" }} kB <em>\u2191 {{ .JSON.Float \"resources.data.traffic.tx_kb\" }} kB</em>{{ else }}Traffic\
        \ unavailable{{ end }}</b><small>Komodo / Periphery \xB7 interval volume, not a per-app rate</small></div>{{ end }}\n</div>"
    - type: custom-api
      title: Plex library
      frameless: true
      css-class: media-ops-widget
      cache: 10s
      update-interval: 10s
      url: http://workload-summary:8090/media-library
      template: "<div class=\"mo-page\"><div class=\"mo-section\"><h3>Library pulse</h3><small>Plex library API \xB7 {{ .JSON.Int \"library.age\"\
        \ }}s since collection \xB7 cache 5m</small></div>{{ if .JSON.String \"library.error\" }}<div class=\"mo-notice\">{{ .JSON.String \"library.error\"\
        \ }}</div>{{ else }}<div class=\"mo-libraries\">{{ range .JSON.Array \"library.data.libraries\" }}<div><b>{{ .Int \"total\" }}</b><span>{{\
        \ .String \"title\" }}</span><small>{{ .String \"type\" }} library items</small></div>{{ end }}</div><div class=\"mo-section\"><h3>Fresh\
        \ on Plex</h3><small>Latest movies & episodes \xB7 newest first</small></div><div class=\"mo-posters\">{{ range .JSON.Array \"library.data.recent\"\
        \ }}<article class=\"mo-poster\"><div class=\"mo-art\">{{ if .String \"poster\" }}<img src=\"data:image/jpeg;base64,{{ .String \"poster\"\
        \ }}\" alt=\"{{ .String \"title\" }} poster\" loading=\"lazy\" width=\"200\" height=\"300\">{{ else }}<span class=\"mo-art-placeholder\"\
        >{{ .String \"type\" }}</span>{{ end }}<span class=\"mo-art-type\">{{ .String \"type\" }}</span></div><h3>{{ if .String \"imdb\" }}<a\
        \ href=\"{{ .String \"imdb\" }}\" target=\"_blank\" rel=\"noopener noreferrer\">{{ .String \"title\" }} \u2197</a>{{ else }}{{ .String\
        \ \"title\" }}{{ end }}</h3><p>{{ .String \"subtitle\" }}</p><small>{{ .String \"library\" }} \xB7 <span data-dynamic-relative-time=\"\
        {{ .Int \"added_at\" }}\"></span></small></article>{{ else }}<p class=\"mo-notice\">Plex returned no recent video additions.</p>{{ end\
        \ }}</div>{{ end }}</div>{{ if .JSON.String \"library.error\" }}<div class=\"mo-page\"><div class=\"mo-section\"><h3>Just landed</h3><small>Verified\
        \ Sonarr / Radarr imports \xB7 not Plex membership</small></div>{{ if .JSON.String \"imports.error\" }}<div class=\"mo-notice\">{{ .JSON.String\
        \ \"imports.error\" }}</div>{{ else }}<div class=\"mo-posters\">{{ range .JSON.Array \"imports.data.recent\" }}<article class=\"mo-poster\"\
        ><div class=\"mo-art\">{{ if .String \"poster\" }}<img src=\"data:image/jpeg;base64,{{ .String \"poster\" }}\" alt=\"{{ .String \"title\"\
        \ }} poster\" loading=\"lazy\" width=\"200\" height=\"300\">{{ else }}<span class=\"mo-art-placeholder\">{{ .String \"type\" }}</span>{{\
        \ end }}<span class=\"mo-art-type\">{{ .String \"type\" }}</span></div><h3>{{ if .String \"imdb\" }}<a href=\"{{ .String \"imdb\" }}\"\
        \ target=\"_blank\" rel=\"noopener noreferrer\">{{ .String \"title\" }} \u2197</a>{{ else }}{{ .String \"title\" }}{{ end }}</h3><p>{{\
        \ .String \"subtitle\" }}</p><small>{{ .String \"library\" }} \xB7 <span data-dynamic-relative-time=\"{{ .Int \"added_at\" }}\"></span></small></article>{{\
        \ else }}<p class=\"mo-notice\">No recent imports returned.</p>{{ end }}</div>{{ end }}</div>{{ end }}"
  - size: small
    widgets:
    - type: custom-api
      title: Sonarr delivery
      frameless: true
      css-class: media-ops-widget
      cache: 10s
      update-interval: 10s
      url: http://workload-summary:8090/media-arr
      template: "<div class=\"mo-page mo-delivery\"><div class=\"mo-section\"><h3>Sonarr \xB7 delivery</h3><small>API \xB7 {{ .JSON.Int \"sonarr.age\"\
        \ }}s ago \xB7 cache 30s</small></div>{{ if .JSON.String \"sonarr.error\" }}<div class=\"mo-notice\">{{ .JSON.String \"sonarr.error\"\
        \ }}</div>{{ else }}<div class=\"mo-queue-heading\"><span>DOWNLOAD QUEUE</span><b>{{ .JSON.Int \"sonarr.data.total\" }}</b></div>{{ range\
        \ .JSON.Array \"sonarr.data.queue\" }}<article class=\"mo-download\"><div><strong>{{ if .String \"imdb\" }}<a href=\"{{ .String \"imdb\"\
        \ }}\" target=\"_blank\" rel=\"noopener noreferrer\">{{ .String \"title\" }} \u2197</a>{{ else }}{{ .String \"title\" }}{{ end }}</strong><span>{{\
        \ .Float \"progress\" }}%</span></div><div class=\"mo-progress\"><i style=\"width:{{ .Float \"progress\" }}%\"></i></div><small>{{ .String\
        \ \"status\" }} \xB7 {{ .String \"tracked\" }} \xB7 {{ .Float \"remaining_gb\" }} GB left \xB7 {{ .String \"eta\" }}</small></article>{{\
        \ else }}<p class=\"mo-empty\">Queue clear \u2014 no tracked downloads.</p>{{ end }}{{ if .JSON.Bool \"sonarr.data.truncated\" }}<p class=\"\
        mo-notice\">Showing first 30 queued items.</p>{{ end }}<details class=\"mo-imports\" open><summary>Recently imported <span>Latest 12 completed\
        \ imports</span></summary>{{ range .JSON.Array \"sonarr.data.recent\" }}<article class=\"mo-import\"><span class=\"mo-check\">\u2713</span><div><h4>{{\
        \ if .String \"imdb\" }}<a href=\"{{ .String \"imdb\" }}\" target=\"_blank\" rel=\"noopener noreferrer\">{{ .String \"title\" }} \u2197\
        </a>{{ else }}{{ .String \"title\" }}{{ end }}</h4><p>{{ .String \"subtitle\" }}</p><small>{{ .String \"quality\" }} \xB7 {{ .String \"\
        date\" }}</small></div></article>{{ else }}<p class=\"mo-empty\">No completed imports returned.</p>{{ end }}</details>{{ end }}</div>"
    - type: custom-api
      title: Radarr delivery
      frameless: true
      css-class: media-ops-widget
      cache: 10s
      update-interval: 10s
      url: http://workload-summary:8090/media-arr
      template: "<div class=\"mo-page mo-delivery\"><div class=\"mo-section\"><h3>Radarr \xB7 delivery</h3><small>API \xB7 {{ .JSON.Int \"radarr.age\"\
        \ }}s ago \xB7 cache 30s</small></div>{{ if .JSON.String \"radarr.error\" }}<div class=\"mo-notice\">{{ .JSON.String \"radarr.error\"\
        \ }}</div>{{ else }}<div class=\"mo-queue-heading\"><span>DOWNLOAD QUEUE</span><b>{{ .JSON.Int \"radarr.data.total\" }}</b></div>{{ range\
        \ .JSON.Array \"radarr.data.queue\" }}<article class=\"mo-download\"><div><strong>{{ if .String \"imdb\" }}<a href=\"{{ .String \"imdb\"\
        \ }}\" target=\"_blank\" rel=\"noopener noreferrer\">{{ .String \"title\" }} \u2197</a>{{ else }}{{ .String \"title\" }}{{ end }}</strong><span>{{\
        \ .Float \"progress\" }}%</span></div><div class=\"mo-progress\"><i style=\"width:{{ .Float \"progress\" }}%\"></i></div><small>{{ .String\
        \ \"status\" }} \xB7 {{ .String \"tracked\" }} \xB7 {{ .Float \"remaining_gb\" }} GB left \xB7 {{ .String \"eta\" }}</small></article>{{\
        \ else }}<p class=\"mo-empty\">Queue clear \u2014 no tracked downloads.</p>{{ end }}{{ if .JSON.Bool \"radarr.data.truncated\" }}<p class=\"\
        mo-notice\">Showing first 30 queued items.</p>{{ end }}<details class=\"mo-imports\" open><summary>Recently imported <span>Latest 12 completed\
        \ imports</span></summary>{{ range .JSON.Array \"radarr.data.recent\" }}<article class=\"mo-import\"><span class=\"mo-check\">\u2713</span><div><h4>{{\
        \ if .String \"imdb\" }}<a href=\"{{ .String \"imdb\" }}\" target=\"_blank\" rel=\"noopener noreferrer\">{{ .String \"title\" }} \u2197\
        </a>{{ else }}{{ .String \"title\" }}{{ end }}</h4><p>{{ .String \"subtitle\" }}</p><small>{{ .String \"quality\" }} \xB7 {{ .String \"\
        date\" }}</small></div></article>{{ else }}<p class=\"mo-empty\">No completed imports returned.</p>{{ end }}</details>{{ end }}</div>"
