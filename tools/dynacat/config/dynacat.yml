document:
  head: '<script src="/assets/local-theme.js"></script><script src="/assets/command-center.js" defer></script>'
server:
  port: 8080
  assets-path: /app/assets
  cache-dir: /app/assets/.cache
  allow-editing: false
  proxied: true
branding:
  app-name: Gray Matter Command Center
  hide-logo: false
  custom-footer: <span>Gray Matter · private operational workspace</span>
  logo-text: GM
  hide-footer: true
  show-desktop-navigation-on-hover: false
  center-desktop-navigation: true
theme:
  background-color: 216 18 8
  primary-color: 215 50 60
  positive-color: 151 49 54
  negative-color: 1 79 62
  contrast-multiplier: 1.25
  text-saturation-multiplier: 0.72
  disable-picker: false
  presets:
    teal-city:
      background-color: 225 14 15
      primary-color: 157 47 65
      contrast-multiplier: 1.1
    midnight-navy:
      background-color: 222 20 7
      primary-color: 215 50 60
      contrast-multiplier: 1.1
    camouflage:
      background-color: 186 21 20
      contrast-multiplier: 1.2
      primary-color: 97 13 80
    catppuccin-frappe:
      background-color: 229 19 23
      contrast-multiplier: 1.2
      primary-color: 222 74 74
      positive-color: 96 44 68
      negative-color: 359 68 71
    catppuccin-macchiato:
      background-color: 232 23 18
      contrast-multiplier: 1.2
      primary-color: 220 83 75
      positive-color: 105 48 72
      negative-color: 351 74 73
    catppuccin-mocha:
      background-color: 240 21 15
      contrast-multiplier: 1.2
      primary-color: 217 92 83
      positive-color: 115 54 76
      negative-color: 347 70 65
    gruvbox-dark:
      background-color: 0 0 16
      primary-color: 43 59 81
      positive-color: 61 66 44
      negative-color: 6 96 59
    kanagawa-dark:
      background-color: 240 13 14
      primary-color: 51 33 68
      negative-color: 358 100 68
      contrast-multiplier: 1.2
    tucan:
      background-color: 50 1 6
      primary-color: 24 97 58
      negative-color: 209 88 54
    dracula:
      background-color: 231 15 21
      primary-color: 265 89 79
      contrast-multiplier: 1.2
      positive-color: 135 94 66
      negative-color: 0 100 67
    shades-of-purple:
      background-color: 243 33 25
      contrast-multiplier: 1.2
      primary-color: 50 100 49
      positive-color: 98 82 71
      negative-color: 12 77 52
    neon-pink-:
      background-color: 240 27 11
      contrast-multiplier: 1.5
      primary-color: 321 100 71
      positive-color: 165 78 51
      negative-color: 360 100 71
    degoog-dark:
      background-color: 227 11 16
      contrast-multiplier: 1.2
      primary-color: 220 34 51
      positive-color: 136 53 43
      negative-color: 5 81 56
    catppuccin-latte:
      light: true
      background-color: 220 23 95
      contrast-multiplier: 1.0
      primary-color: 220 91 54
      positive-color: 109 58 40
      negative-color: 347 87 44
    peachy:
      light: true
      background-color: 28 40 77
      primary-color: 155 100 20
      negative-color: 0 100 60
      contrast-multiplier: 1.1
      text-saturation-multiplier: 0.5
    zebra:
      light: true
      background-color: 0 0 95
      primary-color: 0 0 10
      negative-color: 0 90 50
    morning-paper:
      light: true
      background-color: 40 10 95
      primary-color: 25 50 35
      text-saturation-multiplier: 0.8
    heather-mist:
      light: true
      background-color: 270 12 97
      primary-color: 270 35 50
    degoog-light:
      light: true
      background-color: 0 0 95
      contrast-multiplier: 1.1
      primary-color: 217 36 36
      positive-color: 136 53 40
      negative-color: 5 81 56
  custom-css-file: /assets/command-center.css
pages:
- name: Command Center
  name-icon: mdi:radar
  width: wide
  desktop-navigation-width: wide
  key-bind: d h
  columns:
  - size: small
    widgets:
    - type: clock
      css-class: cc-top-clock
      hour-format: 24h
      timezones:
      - timezone: Europe/Zurich
        label: Bern
      - timezone: America/New_York
        label: New York
    - type: weather
      css-class: cc-top-weather
      location: Bern, Switzerland
      units: metric
      hour-format: 24h
      show-area-name: false
  - size: full
    widgets:
    - type: custom-api
      title: Resources · Proxmox
      css-class: komodo-widget pve-resources
      cache: 1s
      update-interval: 1s
      url: http://workload-summary:8090/current
      template: '{{ if .JSON.String "error" }}<div class="k-warning">{{ .JSON.String "error" }}</div>{{ else }}<div class="k-note">{{ .JSON.String "freshness.state" }} · snapshot age {{ printf "%.0f" (.JSON.Float "freshness.age_seconds") }}s · max 30s</div>{{ if .JSON.String "pve.error" }}<div class="k-warning">{{ .JSON.String "pve.error" }}</div>{{ else }}

        <div class="pve-heading"><span>PHYSICAL HYPERVISORS</span><span class="pve-live">● UI 1s · collector 5s · PVE ~10s · RRD 1m</span></div>

        <div class="pve-grid">{{ range .JSON.Array "pve.nodes" }}<a class="pve-node cc-resource-link" href="{{ .String "url" }}" target="_blank" rel="noopener noreferrer">

        <header><strong>{{ .String "name" }}</strong><span class="k-state {{ if ne (.String "status") "online" }}k-warning{{ end }}">● {{ .String "status"
        }}</span></header>

        <div class="pve-cpu"><span class="pve-label">CPU</span>{{ if ne (.String "cpu_percent") "" }}<strong>{{ printf "%.1f" (.Float "cpu_percent") }}<em>%</em></strong><meter aria-label="CPU
        utilization" min="0" max="100" value="{{ .Float "cpu_percent" }}"></meter>{{ else }}<strong>N/A</strong>{{ end }}

        {{ if gt (.Int "history.samples") 1 }}<svg class="pve-spark" viewBox="0 0 100 30" preserveAspectRatio="none" role="img" aria-label="CPU utilization over the last hour, fixed
        0 to 100 percent scale"><path d="M0 30 H100 M0 15 H100" class="pve-gridline"/><polyline points="{{ .String "history.cpu_points" }}"/></svg><div class="pve-caption"><span>CPU
        · {{ .String "history.window" }} history</span><span>{{ .Int "history.samples" }} samples</span></div>{{ else }}<div class="pve-no-history">History unavailable</div>{{ end }}</div>

        <div class="pve-capacities">

        <div class="pve-capacity"><label>MEMORY {{ if ne (.String "ram.percent") "" }}<b>{{ printf "%.1f" (.Float "ram.percent") }}%</b></label><meter aria-label="Memory used" min="0"
        max="100" value="{{ .Float "ram.percent" }}"></meter><small>{{ printf "%.1f" (div (.Float "ram.used_bytes") 1073741824) }} / {{ printf "%.1f" (div (.Float "ram.total_bytes")
        1073741824) }} GiB{{ else }}<b>N/A</b></label><small>Reading unavailable{{ end }}</small></div>


        </div>

        <div class="pve-zfs">{{ range .Array "zfs" }}<div class="pve-capacity"><label>ZFS · {{ .String "name" }} {{ if ne (.String "percent") "" }}<b>{{ printf "%.1f" (.Float "percent")
        }}%</b></label><meter aria-label="ZFS pool allocated" min="0" max="100" value="{{ .Float "percent" }}"></meter><small>{{ printf "%.1f" (div (.Float "used_bytes") 1073741824)
        }} / {{ printf "%.1f" (div (.Float "total_bytes") 1073741824) }} GiB · <b>{{ printf "%.1f" (div (.Float "free_bytes") 1073741824) }} GiB free</b></small>{{ else }}<b>N/A</b></label>{{
        end }}<small>{{ if eq (.String "scope") "physical_pool" }}Physical pool allocation{{ else }}ZFS-backed storage · not whole pool{{ end }}</small></div>{{ else }}<span class="pve-label">ZFS</span><small>{{
        if eq (.String "zfs_state") "none" }}No ZFS pools reported{{ else }}ZFS telemetry unavailable{{ end }}</small>{{ end }}{{ if .String "zfs_error" }}<small class="k-warning">{{
        .String "zfs_error" }}</small>{{ end }}</div>

        <div class="pve-network"><span class="pve-label">NETWORK ACTIVITY <small>{{ .String "history.window" }} · 1m averages</small></span>

        {{ if or (gt (len (.Array "history.net_rx_segments")) 0) (gt (len (.Array "history.net_tx_segments")) 0) }}<svg class="pve-netgraph" viewBox="0 0 100 30" preserveAspectRatio="none"
        role="img" aria-label="Real network receive and transmit history, bytes per second"><path d="M0 0 H100 M0 15 H100 M0 30 H100" class="pve-gridline"/>{{ range .Array "history.net_rx_segments"
        }}<polyline class="pve-rx" points="{{ .String "" }}"/>{{ end }}{{ range .Array "history.net_tx_segments" }}<polyline class="pve-tx" points="{{ .String "" }}"/>{{ end }}</svg><div
        class="pve-netaxis"><span>{{ .String "history.window" }} ago</span><span>0–{{ printf "%.1f" (div (.Float "history.net_scale_bytes_sec") 1048576) }} MiB/s</span><span>latest</span></div>{{
        else }}<div class="pve-no-net">Network history unavailable</div>{{ end }}<div>{{ if ne (.String "net_in_bytes_sec") "" }}<span class="pve-rx-label">↓ RX <b>{{ printf "%.1f" (div
        (.Float "net_in_bytes_sec") 1024) }}</b> KiB/s</span>{{ else }}<span>↓ N/A</span>{{ end }}{{ if ne (.String "net_out_bytes_sec") "" }}<span class="pve-tx-label">↑ TX <b>{{ printf
        "%.1f" (div (.Float "net_out_bytes_sec") 1024) }}</b> KiB/s</span>{{ else }}<span>↑ N/A</span>{{ end }}</div></div>

        <footer><span><b>{{ .Int "guests.qemu.running" }}</b>/{{ .Int "guests.qemu.total" }} VM</span><span><b>{{ .Int "guests.lxc.running" }}</b>/{{ .Int "guests.lxc.total" }} LXC</span><small>running
        / total</small></footer>

        </a>{{ end }}</div><div class="k-note pve-source">Source: Proxmox node API + RRD + ZFS pools · collected <span class="pve-timestamp" data-dynamic-relative-time="{{ .JSON.Int
        "pve.fetched_at" }}"></span> · ZFS = physical pool allocation, not guest disk capacity.</div>{{ end }}{{ end }}'
      title-url: https://proxmox.graymatter.ch
    - type: custom-api
      title: Proxmox · workload overview
      title-url: https://proxmox.graymatter.ch
      css-class: komodo-widget komodo-hosts pve-guests
      cache: 1s
      update-interval: 1s
      url: http://workload-summary:8090/current
      template: '{{ if .JSON.String "error" }}<div class="k-warning">{{ .JSON.String "error" }}</div>{{ else }}<div class="k-note">{{ .JSON.String "freshness.state" }} · snapshot age {{ printf "%.0f" (.JSON.Float "freshness.age_seconds") }}s · max 30s</div>{{ if .JSON.String "pve.error" }}<div class="k-warning">{{ .JSON.String "pve.error" }}</div>{{ else }}<div class="k-inventory-head"><span>{{ len (.JSON.Array `pve.guest_inventory.#(status=="running")#`)
        }} running guests · Proxmox API</span><span>VM / LXC</span></div><div class="k-host-grid">{{ range .JSON.Array `pve.guest_inventory.#(status=="running")#` }}<a class="k-host cc-resource-link" href="{{ .String "url" }}" target="_blank" rel="noopener noreferrer"><header><strong>{{
        .String "name" }}</strong><span class="k-state">● {{ if eq (.String "type") "qemu" }}VM{{ else }}LXC{{ end }}</span></header><div class="pve-guest-meta">{{ .String "node" }}
        · #{{ .Int "id" }}</div><div class="k-metrics"><div><label>CPU {{ if ne (.String "cpu_percent") "" }}<b>{{ printf "%.1f" (.Float "cpu_percent") }}%</b></label><meter min="0"
        max="100" value="{{ .Float "cpu_percent" }}"></meter>{{ else }}<b>N/A</b></label><div class="k-unavailable-bar"></div>{{ end }}</div><div class="pve-guest-ram" title="{{ .String
        "memory_scope" }}"><label>RAM {{ if ne (.String "ram.percent") "" }}<b>{{ printf "%.0f" (.Float "ram.percent") }}%</b></label><meter min="0" max="100" value="{{ .Float "ram.percent"
        }}"></meter><small>{{ printf "%.1f" (div (.Float "ram.used_bytes") 1073741824) }} / {{ printf "%.1f" (div (.Float "ram.total_bytes") 1073741824) }} GiB</small>{{ else }}<b>N/A</b></label><div
        class="k-unavailable-bar"></div>{{ end }}</div><div class="pve-guest-disk"><label>DISK {{ if ne (.String "disk.percent") "" }}<b>{{ printf "%.0f" (.Float "disk.percent") }}%</b></label><meter
        min="0" max="100" value="{{ .Float "disk.percent" }}"></meter><small>{{ printf "%.1f" (div (.Float "disk.used_bytes") 1073741824) }} GiB used</small>{{ else }}<b>N/A</b></label><div
        class="k-unavailable-bar"></div>{{ if gt (.Float "disk.total_bytes") 0.0 }}<small>{{ printf "%.0f" (div (.Float "disk.total_bytes") 1073741824) }} GiB allocated</small>{{ else
        }}<small>Not reported</small>{{ end }}{{ end }}</div></div><div class="pve-guest-source">CPU PVE · RAM {{ if eq (.String "memory_source") "Komodo" }}Komodo{{ else }}{{ if eq
        (.String "type") "qemu" }}PVE host{{ else }}PVE{{ end }}{{ end }} · disk {{ if eq (.String "disk_source") "Komodo" }}Komodo{{ else }}{{ if eq (.String "type") "qemu" }}unavailable{{
        else }}PVE{{ end }}{{ end }}</div></a>{{ end }}</div><details class="k-stack-group pve-stopped"><summary><strong>{{ len (.JSON.Array `pve.guest_inventory.#(status!="running")#`)
        }} stopped / other guests</strong><span>show inventory</span></summary>{{ range .JSON.Array `pve.guest_inventory.#(status!="running")#` }}<a class="k-top-row cc-resource-link" href="{{ .String "url" }}" target="_blank" rel="noopener noreferrer"><strong>{{ .String
        "name" }}</strong><small>{{ .String "node" }} · {{ .String "type" }} #{{ .Int "id" }} · {{ .String "status" }}</small></a>{{ end }}</details><div class="k-note">Inventory /
        CPU and LXC metrics: Proxmox. VM RAM / aggregate filesystem usage: identity-verified Komodo guests. PVE host RAM is used only if guest readings are unavailable (QEMU overhead
        may exceed configured RAM). Allocated disk ≠ used space; mounts may overlap. Stopped ≠ disabled; no guest disable policy applied. UI refresh 1s; collector cache 5s; PVE samples ~10s.</div>{{ end }}{{ end }}'
    - type: custom-api
      title: Workloads · attention first
      title-url: https://komodo.graymatter.ch
      css-class: komodo-widget workload-attention
      cache: 1s
      update-interval: 1s
      url: http://workload-summary:8090/current
      template: '{{ if .JSON.String "error" }}<div class="k-warning">{{ .JSON.String "error" }}</div>{{ else }}<div class="k-note">{{ .JSON.String "freshness.state" }} · snapshot age {{ printf "%.0f" (.JSON.Float "freshness.age_seconds") }}s · max 30s</div><div class="k-summary"><div><strong>{{ .JSON.Int "running_stacks" }}</strong><span>RUNNING STACKS</span></div><div><strong>{{ .JSON.Int "running_containers" }}</strong><span>RUNNING
        CONTAINERS</span></div><div><strong>{{ len (.JSON.Array "stack_problems") }}</strong><span>RUNTIME STACK ISSUES</span></div><div><strong>{{ len (.JSON.Array "container_problems")
        }}</strong><span>CONTAINER ISSUES</span></div></div>

        <div class="k-note">Enabled workloads only · UI refresh 1s · collector cache 5s · {{ .JSON.Int "stacks_total" }} stacks / {{ .JSON.Int "containers_total" }} containers · fetched <span data-dynamic-relative-time="{{
        .JSON.Int "fetched_at" }}"></span></div>

        {{ range .JSON.Array "stack_problems" }}<div class="k-problem"><a href="https://komodo.graymatter.ch/stacks/{{ .String "id" }}">{{ .String "name" }}</a><span>{{ .String "host"
        }} · {{ .String "state" }}</span></div>{{ end }}

        {{ range .JSON.Array "container_problems" }}<div class="k-problem"><a class="cc-container-link" href="{{ .String "url" }}" target="_blank" rel="noopener noreferrer">{{ .String "name" }}</a><span>{{ .String "host" }} · {{ .String "status" }}</span></div>{{ end
        }}

        <details class="k-stack-group"><summary><strong>{{ len (.JSON.Array "definition_issues") }} unassigned definitions</strong><span>runtime unknown</span></summary><div class="k-note">No
        assigned server or swarm. Retained definitions, not confirmed running incidents or deliberately disabled workloads.</div>{{ range .JSON.Array "definition_issues" }}<div class="k-top-row"><a
        href="https://komodo.graymatter.ch/stacks/{{ .String "id" }}">{{ .String "name" }}</a><small>Unassigned · runtime unknown</small></div>{{ end }}</details><div class="k-note">Stopped
        / unhealthy containers remain actionable, including legacy unmanaged containers. Age does not prove retirement.</div><div class="k-group-grid">{{ range .JSON.Array "groups" }}<details
        class="k-stack-group"><summary><strong>{{ .String "host" }}</strong><span>{{ .Int "count" }} running</span></summary><div class="k-chips">{{ range .Array "stacks" }}<a class="k-stack-chip"
        href="https://komodo.graymatter.ch/stacks/{{ .String "id" }}">{{ trimPrefix (concat (.String "host") "_") (.String "name") }}</a>{{ end }}</div></details>{{ end }}</div>{{ end }}'
    - type: custom-api
      title: Top 5 · CPU / RAM / disk capacity
      css-class: komodo-widget top-consumers
      cache: 1s
      update-interval: 1s
      url: http://workload-summary:8090/current
      template: '{{ if .JSON.String "error" }}<div class="k-warning">{{ .JSON.String "error" }}</div>{{ else }}<div class="k-note">{{ .JSON.String "freshness.state" }} · snapshot age {{ printf "%.0f" (.JSON.Float "freshness.age_seconds") }}s · max 30s</div><div class="k-top-grid"><section><h3>CPU · top 5</h3>{{ range .JSON.Array "top_cpu" }}<div class="k-top-row"><div><a class="k-rank-link" href="{{ .String "url" }}" target="_blank"
        rel="noopener noreferrer">{{ .String "name" }}</a><small>{{ .String "host" }}</small></div><b>{{ printf "%.1f" (.Float "cpu") }}%</b></div>{{ else }}<p>CPU metrics unavailable</p>{{
        end }}</section><section><h3>RAM · top 5</h3>{{ range .JSON.Array "top_ram" }}<div class="k-top-row"><div><a class="k-rank-link" href="{{ .String "url" }}" target="_blank" rel="noopener
        noreferrer">{{ .String "name" }}</a><small>{{ .String "host" }}</small></div><b>{{ .String "ram" }}</b></div>{{ else }}<p>RAM metrics unavailable</p>{{ end }}</section><section><h3>Disk
        capacity · top 5 hosts</h3>{{ range .JSON.Array "top_disk" }}<div class="k-top-row"><div>{{ if .String "url" }}<a class="k-rank-link" href="{{ .String "url" }}" target="_blank" rel="noopener noreferrer">{{ .String "name" }}</a>{{ else }}<strong title="Proxmox identity not verified">{{ .String "name" }}</strong>{{ end }}<small>{{ printf "%.1f" (.Float "used") }} / {{ printf "%.1f" (.Float "total") }} GiB</small></div><b>{{ printf "%.1f" (.Float "percent") }}%</b></div>{{
        else }}<p>Disk metrics unavailable</p>{{ end }}</section></div><div class="k-note">Measured by Docker via Komodo · running enabled workloads · UI refresh 1s · collector cache 5s</div><div class="k-note">Disk:
        enabled reporting Komodo hosts ranked by aggregate filesystem % used. Not container size, physical HDD usage or I/O rate; mounts may overlap. CPU/RAM: running containers; Docker
        CPU may exceed 100%.</div>{{ end }}'
  - size: small
    widgets:
    - type: custom-api
      title: Renovate · open PRs
      title-url: https://github.com/nikolanovoselec/komodo/pulls?q=is%3Apr+is%3Aopen+author%3Aapp%2Frenovate
      css-class: komodo-widget renovate-prs
      cache: 1m
      update-interval: 1m
      url: http://workload-summary:8090/summary
      template: '{{ if .JSON.String "renovate.error" }}<div class="k-warning">{{ .JSON.String "renovate.error" }}</div>{{ else }}<div class="renovate-count"><b>{{ .JSON.Int "renovate.count"
        }}</b><span>{{ if .JSON.Bool "renovate.truncated" }}loaded open PRs · partial list{{ else }}open Renovate PRs{{ end }}</span></div><div class="k-note">nikolanovoselec / komodo</div>{{
        range .JSON.Array "renovate.prs" }}<a class="renovate-pr" href="{{ .String "url" }}" target="_blank" rel="noopener noreferrer"><small>#{{ .Int "number" }} <span>↗</span></small><strong>{{
        .String "title" }}</strong></a>{{ else }}<div class="k-note">No open Renovate PRs</div>{{ end }}<div class="k-fresh">GitHub API · checked <span data-dynamic-relative-time="{{
        .JSON.Int "renovate.fetched_at" }}"></span> · UI refresh 1m · GitHub cache 10m</div>{{ end }}'
- name: Media Ops
  slug: media-ops
  name-icon: mdi:play-circle
  width: wide
  desktop-navigation-width: wide
  key-bind: d m
  columns:
  - size: small
    widgets:
    - type: torrenting
      title: Active downloads
      title-icon: mdi:download-network
      update-interval: 30s
      hide-completed: true
      hide-inactive: true
      wrap-text: true
      collapse-after: 8
      hosts:
      - url: http://192.168.2.38:8080
        username: dynacat
        password: dynacat
    - type: calendar
      title: Release calendar
      title-icon: mdi:calendar-star
      show-release-state: true
      update-interval: 30m
      hosts:
      - url: sonarr:http://192.168.2.38:8988
        public-url: https://sonarr.graymatter.ch
        token: ${SONARR_API_KEY}
      - url: radarr:http://192.168.2.38:8309
        public-url: https://radarr.graymatter.ch
        token: ${RADARR_API_KEY}
    - type: bookmarks
      groups:
      - title: Media control
        color: 222 74 74
        links:
        - title: Plex
          url: https://plex.novoselec.ch
          icon: si:plex
        - title: qBittorrent
          url: https://qbittorrent.graymatter.ch
          icon: si:qbittorrent
        - title: Sonarr
          url: https://sonarr.graymatter.ch
          icon: si:sonarr
        - title: Radarr
          url: https://radarr.graymatter.ch
          icon: si:radarr
  - size: full
    widgets:
    - type: html
      frameless: true
      css-class: section-label
      source: <div><span class="status-dot"></span> MEDIA CONTROL <small>Downloads · releases · servers · library</small></div>
    - type: monitor
      title: Media container estate
      title-icon: mdi:docker
      style: compact
      show-history: true
      update-interval: 1m
      sites:
      - title: Dozzle
        url: https://dozzle.local.graymatter.ch/
      - title: Plex
        url: https://plex.novoselec.ch
      - title: qBittorrent
        url: https://qbittorrent.graymatter.ch
      - title: Sonarr
        url: https://sonarr.graymatter.ch
      - title: Radarr
        url: https://radarr.graymatter.ch
    - type: videos
      title: Architecture & technology
      title-icon: mdi:youtube
      channels:
      - UCXuqSBlHAE6Xw-yeJA0Tunw
      - UCBJycsmduvYEL83R_U4JriQ
      - UCHnyfMqiRRG1u-2MsSQLbXA
      style: grid-cards
      limit: 9
      collapse-after-rows: 1
  - size: small
    widgets:
    - type: monitor
      title: Media services
      style: compact
      show-history: true
      sites:
      - title: Plex
        url: https://plex.novoselec.ch
      - title: Sonarr
        url: https://sonarr.graymatter.ch
      - title: Radarr
        url: https://radarr.graymatter.ch
      - title: qBittorrent
        url: https://qbittorrent.graymatter.ch
      - title: Tautulli
        url: https://tautulli.graymatter.ch
    - type: rss
      title: Media signal
      style: vertical-list
      limit: 8
      collapse-after: 6
      single-line-titles: true
      feeds:
      - title: Ars Technica
        url: https://feeds.arstechnica.com/arstechnica/index
- name: Directory
  slug: directory
  name-icon: mdi:apps
  width: wide
  desktop-navigation-width: wide
  key-bind: d d
  columns:
  - size: full
    widgets:
    - type: bookmarks
      groups:
      - title: Control plane
        color: 8 82 67
        links:
        - title: Authentik
          url: https://authentik.graymatter.ch/if/admin/#/administration/overview
          description: Identitiy and access management
        - title: Backrest Komodo
          url: https://backrest-komodo.graymatter.ch
          description: Backup and restore
        - title: Backrest Media Servers
          url: https://backrest-mediaservers.graymatter.ch
          description: Backup and restore
        - title: Backrest Middleware
          url: https://backrest-middleware.graymatter.ch
          description: Backup and restore
