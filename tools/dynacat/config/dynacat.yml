# Managed through nikolanovoselec/komodo. Cloudflare Access is the access boundary.
# No Dynacat application authentication or Docker socket is configured.

server:
  port: 8080
  assets-path: /app/assets
  cache-dir: /app/assets/.cache
  allow-editing: false
branding:
  app-name: Nikola Control Plane
  hide-logo: false
  custom-footer: <span>Gray Matter · private operational workspace</span>
