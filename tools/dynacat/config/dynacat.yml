  custom-css-file: /assets/command-center.css
pages:
- name: Hardware & Workloads
  slug: hardware-workloads
  name-icon: mdi:radar
  width: wide
  desktop-navigation-width: wide
  key-bind: d h
  columns:
  - size: full
    widgets:
    - type: custom-api
      title: Proxmox Cluster
      css-class: komodo-widget pve-resources
      cache: 1s
      update-interval: 1s
      url: http://workload-summary:8090/pve-current
      template: '{{ if .JSON.String "error" }}<div class="k-warning">{{ .JSON.String "error" }}</div>{{ else }}<div class="k-note">{{ .JSON.String "freshness.state" }} · snapshot age {{ printf "%.0f" (.JSON.Float "freshness.age_seconds") }}s · max 30s</div>{{ if .JSON.String "pve.error" }}<div class="k-warning">{{ .JSON.String "pve.error" }}</div>{{ else }}

        <div class="pve-heading"><span>PHYSICAL HYPERVISORS</span><span class="pve-live">● UI 1s · collector 5s · PVE ~10s · RRD 1m</span></div>

        <div class="pve-grid">{{ range .JSON.Array "pve.nodes" }}<a class="pve-node cc-resource-link" href="{{ .String "url" }}" target="_blank" rel="noopener noreferrer">

        <header><strong>{{ .String "name" }}</strong><span class="k-state {{ if ne (.String "status") "online" }}k-warning{{ end }}">● {{ .String "status"
        }}</span></header>

        <div class="pve-cpu"><span class="pve-label">CPU</span>{{ if ne (.String "cpu_percent") "" }}<strong>{{ printf "%.1f" (.Float "cpu_percent") }}<em>%</em></strong><meter aria-label="CPU
        utilization" min="0" max="100" value="{{ .Float "cpu_percent" }}"></meter>{{ else }}<strong>N/A</strong>{{ end }}

        {{ if gt (.Int "history.samples") 1 }}<svg class="pve-spark" viewBox="0 0 100 30" preserveAspectRatio="none" role="img" aria-label="CPU utilization over the last hour, fixed
        0 to 100 percent scale"><path d="M0 30 H100 M0 15 H100" class="pve-gridline"/><polyline points="{{ .String "history.cpu_points" }}"/></svg><div class="pve-caption"><span>CPU
        · {{ .String "history.window" }} history</span><span>{{ .Int "history.samples" }} samples</span></div>{{ else }}<div class="pve-no-history">History unavailable</div>{{ end }}</div>

        <div class="pve-capacities">

        <div class="pve-capacity"><label>MEMORY {{ if ne (.String "ram.percent") "" }}<b>{{ printf "%.1f" (.Float "ram.percent") }}%</b></label><meter aria-label="Memory used" min="0"
        max="100" value="{{ .Float "ram.percent" }}"></meter><small>{{ printf "%.1f" (div (.Float "ram.used_bytes") 1073741824) }} / {{ printf "%.1f" (div (.Float "ram.total_bytes")
        1073741824) }} GiB{{ else }}<b>N/A</b></label><small>Reading unavailable{{ end }}</small></div>


        </div>

        <div class="pve-zfs">{{ range .Array "zfs" }}<div class="pve-capacity"><label>ZFS · {{ .String "name" }} {{ if ne (.String "percent") "" }}<b>{{ printf "%.1f" (.Float "percent")
        }}%</b></label><meter aria-label="ZFS pool allocated" min="0" max="100" value="{{ .Float "percent" }}"></meter><small>{{ printf "%.1f" (div (.Float "used_bytes") 1073741824)
        }} / {{ printf "%.1f" (div (.Float "total_bytes") 1073741824) }} GiB · <b>{{ printf "%.1f" (div (.Float "free_bytes") 1073741824) }} GiB free</b></small>{{ else }}<b>N/A</b></label>{{
        end }}<small>{{ if eq (.String "scope") "physical_pool" }}Physical pool allocation{{ else }}ZFS-backed storage · not whole pool{{ end }}</small></div>{{ else }}<span class="pve-label">ZFS</span><small>{{
        if eq (.String "zfs_state") "none" }}No ZFS pools reported{{ else }}ZFS telemetry unavailable{{ end }}</small>{{ end }}{{ if .String "zfs_error" }}<small class="k-warning">{{
        .String "zfs_error" }}</small>{{ end }}</div>

        <div class="pve-network"><span class="pve-label">NETWORK ACTIVITY <small>{{ .String "history.window" }} · 1m averages</small></span>

        {{ if or (gt (len (.Array "history.net_rx_segments")) 0) (gt (len (.Array "history.net_tx_segments")) 0) }}<svg class="pve-netgraph" viewBox="0 0 100 30" preserveAspectRatio="none"
        role="img" aria-label="Real network receive and transmit history, bytes per second"><path d="M0 0 H100 M0 15 H100 M0 30 H100" class="pve-gridline"/>{{ range .Array "history.net_rx_segments"
        }}<polyline class="pve-rx" points="{{ .String "" }}"/>{{ end }}{{ range .Array "history.net_tx_segments" }}<polyline class="pve-tx" points="{{ .String "" }}"/>{{ end }}</svg><div
        class="pve-netaxis"><span>{{ .String "history.window" }} ago</span><span>0–{{ printf "%.1f" (div (.Float "history.net_scale_bytes_sec") 1048576) }} MiB/s</span><span>latest</span></div>{{
        else }}<div class="pve-no-net">Network history unavailable</div>{{ end }}<div>{{ if ne (.String "net_in_bytes_sec") "" }}<span class="pve-rx-label">↓ RX <b>{{ printf "%.1f" (div
        (.Float "net_in_bytes_sec") 1024) }}</b> KiB/s</span>{{ else }}<span>↓ N/A</span>{{ end }}{{ if ne (.String "net_out_bytes_sec") "" }}<span class="pve-tx-label">↑ TX <b>{{ printf
        "%.1f" (div (.Float "net_out_bytes_sec") 1024) }}</b> KiB/s</span>{{ else }}<span>↑ N/A</span>{{ end }}</div></div>

        <footer><span><b>{{ .Int "guests.qemu.running" }}</b>/{{ .Int "guests.qemu.total" }} VM</span><span><b>{{ .Int "guests.lxc.running" }}</b>/{{ .Int "guests.lxc.total" }} LXC</span><small>running
        / total</small></footer>

        </a>{{ end }}</div><div class="k-note pve-source">Source: Proxmox node API + RRD + ZFS pools · collected <span class="pve-timestamp" data-dynamic-relative-time="{{ .JSON.Int
        "pve.fetched_at" }}"></span> · ZFS = physical pool allocation, not guest disk capacity.</div>{{ end }}{{ end }}'
      title-url: https://proxmox.graymatter.ch
    - type: custom-api
      title: Workloads
      title-url: https://proxmox.graymatter.ch
      css-class: komodo-widget komodo-hosts pve-guests cw-merged
      cache: 1s
      update-interval: 1s
      url: http://workload-summary:8090/current
      template: '{{ if .JSON.String "error" }}<div class="k-warning">{{ .JSON.String "error" }}</div>{{ else }}<div class="cw-status"><span class="{{ if gt (len (.JSON.Array "container_problems")) 0 }}cw-issue{{ else }}cw-normal{{ end }}">{{ len (.JSON.Array "container_problems") }} container issues</span><span aria-hidden="true">·</span><span class="{{ if gt (len (.JSON.Array "stack_problems")) 0 }}cw-issue{{ else }}cw-normal{{ end }}">{{ len (.JSON.Array "stack_problems") }} stack issues</span></div><div class="cw-overview"><span><b>{{ len (.JSON.Array `pve.guest_inventory.#(status=="running")#`) }}</b> running VM / LXC guests</span><span><b>{{ .JSON.Int "running_containers" }}/{{ .JSON.Int "containers_total" }}</b> enabled Docker containers</span><span><b>{{ .JSON.Int "running_stacks" }}/{{ .JSON.Int "stacks_total" }}</b> stacks running</span></div><div class="k-note">{{ .JSON.String "freshness.state" }} · snapshot age {{ .JSON.Float "freshness.age_seconds" | printf "%.0f" }}s · max 30s · Docker grouped only by audited guest identity</div>{{ if .JSON.String "pve.error" }}<div class="k-warning">{{ .JSON.String "pve.error" }}</div>{{ else }}<div class="cw-matrix-head"><div class="pve-matrix-head"><span>WORKLOAD / NODE</span><div><span>CPU</span><span>RAM</span><span>DISK USED</span></div></div><span>DOCKER · PER MACHINE</span></div><div class="k-host-grid cw-workloads">{{ range .JSON.Array `pve.guest_inventory.#(status=="running")#` }}<article class="cw-workload"><a title="CPU: Proxmox; RAM: {{ .String "memory_scope" }}; Disk: {{ .String "disk_scope" }}" class="k-host cc-resource-link" href="{{ .String "url" }}" target="_blank" rel="noopener noreferrer"><header><strong>{{ .String "name" }}</strong><span class="pve-guest-meta">{{ .String "node" }} · #{{ .Int "id" }}</span><span class="k-state">● {{ if eq (.String "type") "qemu" }}VM{{ else }}LXC{{ end }}</span></header><div class="k-metrics"><div><label>CPU {{ if ne (.String "cpu_percent") "" }}<b>{{ printf "%.1f" (.Float "cpu_percent") }}%</b></label><meter min="0" max="100" value="{{ .Float "cpu_percent" }}"></meter>{{ else }}<b>N/A</b></label><div class="k-unavailable-bar"></div>{{ end }}</div><div class="pve-guest-ram" title="{{ .String "memory_scope" }}"><label>RAM {{ if ne (.String "ram.percent") "" }}<b>{{ printf "%.0f" (.Float "ram.percent") }}%</b></label><meter min="0" max="100" value="{{ .Float "ram.percent" }}"></meter><small>{{ printf "%.1f" (div (.Float "ram.used_bytes") 1073741824) }} / {{ printf "%.1f" (div (.Float "ram.total_bytes") 1073741824) }} GiB</small>{{ else }}<b>N/A</b></label><div class="k-unavailable-bar"></div>{{ end }}</div><div class="pve-guest-disk"><label>DISK {{ if ne (.String "disk.percent") "" }}<b>{{ printf "%.0f" (.Float "disk.percent") }}%</b></label><meter min="0" max="100" value="{{ .Float "disk.percent" }}"></meter><small>{{ printf "%.1f" (div (.Float "disk.used_bytes") 1073741824) }} GiB used</small>{{ else }}<b>N/A</b></label><div class="k-unavailable-bar"></div>{{ if gt (.Float "disk.total_bytes") 0.0 }}<small>{{ printf "%.0f" (div (.Float "disk.total_bytes") 1073741824) }} GiB allocated</small>{{ else }}<small>Not reported</small>{{ end }}{{ end }}</div></div></a><details class="cw-docker"><summary aria-expanded="false" aria-controls="cw-containers-{{ .String "type" }}-{{ .Int "id" }}"><strong class="cw-detail-key">{{ .String "type" }} #{{ .Int "id" }} containers</strong>{{ if .Bool "docker.available" }}<div class="cw-docker-count"><b>{{ .Int "docker.running" }}<small>/{{ .Int "docker.total" }}</small></b><span>containers running</span><i>▸</i></div><div class="cw-docker-stats"><span title="{{ .String "docker.cpu_scope" }}">ΣCPU {{ if ne (.String "docker.cpu") "" }}<b>{{ .Float "docker.cpu" | printf "%.1f" }}%</b>{{ else }}—{{ end }}</span><span title="{{ .String "docker.ram_scope" }}">ΣRAM {{ if ne (.String "docker.ram_bytes") "" }}<b>{{ div (.Float "docker.ram_bytes") 1073741824 | printf "%.2f" }} GiB</b>{{ else }}—{{ end }}</span></div>{{ if or (gt (.Int "docker.failed") 0) (gt (.Int "docker.unhealthy") 0) (gt (len (.Array "docker.stack_problems")) 0) }}<div class="cw-alert">{{ .Int "docker.failed" }} stopped / other · {{ .Int "docker.unhealthy" }} unhealthy · {{ len (.Array "docker.stack_problems") }} stack issues</div>{{ end }}{{ else }}<div class="cw-no-docker">{{ if .String "docker.status" }}{{ .String "docker.status" }}{{ else }}No Docker data{{ end }}</div>{{ if gt (len (.Array "docker.stack_problems")) 0 }}<div class="cw-alert">{{ len (.Array "docker.stack_problems") }} stack issues ▸</div>{{ end }}{{ end }}<span class="cw-hide-hint">Hide containers ↑</span></summary><div class="cw-docker-expanded" id="cw-containers-{{ .String "type" }}-{{ .Int "id" }}"><div class="cw-collapse-bar"><button type="button" data-cw-collapse>Hide containers ↑</button></div>{{ if .Bool "docker.available" }}<div class="cw-docker-scope">Komodo / Docker · CPU is summed across cores and can exceed 100%; RAM is summed container accounting, not host memory.<br>Measured running containers: CPU {{ .Int "docker.cpu_coverage.measured" }}/{{ .Int "docker.cpu_coverage.running" }} · RAM {{ .Int "docker.ram_coverage.measured" }}/{{ .Int "docker.ram_coverage.running" }} · server sample {{ .Float "docker.age_seconds" | printf "%.0f" }}s old.</div>{{ else }}<p class="cw-docker-scope">No current identity-verified Docker inventory. This is not a claim of zero containers or no installed daemon.</p>{{ end }}<div class="cw-container-table">{{ range .Array "docker.containers" }}<a class="cw-container cc-container-link" href="{{ .String "url" }}" target="_blank" rel="noopener noreferrer"><div><strong>{{ .String "name" }}</strong><small>{{ .String "status" }}</small></div><span class="cw-state cw-state-{{ .String "state" }}">{{ .String "state" }}</span><span>{{ if ne (.String "cpu") "" }}{{ .Float "cpu" | printf "%.2f" }}% CPU{{ else }}CPU —{{ end }}</span><span>{{ .String "ram" }}</span></a>{{ end }}</div>{{ range .Array "docker.stack_problems" }}<div class="cw-problem"><a href="https://komodo.graymatter.ch/stacks/{{ .String "id" }}" target="_blank" rel="noopener noreferrer">{{ .String "name" }} ↗</a><span>{{ .String "state" }} · stack</span></div>{{ end }}</div></details></article>{{ end }}</div><details class="k-stack-group pve-stopped"><summary><strong>{{ len (.JSON.Array `pve.guest_inventory.#(status!="running")#`) }} stopped / other guests</strong><span>show inventory</span></summary>{{ range .JSON.Array `pve.guest_inventory.#(status!="running")#` }}<article class="cw-stopped-guest"><a class="k-top-row cc-resource-link" href="{{ .String "url" }}" target="_blank" rel="noopener noreferrer"><strong>{{ .String "name" }}</strong><small>{{ .String "node" }} · {{ .String "type" }} #{{ .Int "id" }} · {{ .String "status" }}</small></a><details class="cw-docker"><summary aria-expanded="false" aria-controls="cw-containers-{{ .String "type" }}-{{ .Int "id" }}"><strong class="cw-detail-key">{{ .String "type" }} #{{ .Int "id" }} containers</strong>{{ if .Bool "docker.available" }}<div class="cw-docker-count"><b>{{ .Int "docker.running" }}<small>/{{ .Int "docker.total" }}</small></b><span>containers running</span><i>▸</i></div><div class="cw-docker-stats"><span title="{{ .String "docker.cpu_scope" }}">ΣCPU {{ if ne (.String "docker.cpu") "" }}<b>{{ .Float "docker.cpu" | printf "%.1f" }}%</b>{{ else }}—{{ end }}</span><span title="{{ .String "docker.ram_scope" }}">ΣRAM {{ if ne (.String "docker.ram_bytes") "" }}<b>{{ div (.Float "docker.ram_bytes") 1073741824 | printf "%.2f" }} GiB</b>{{ else }}—{{ end }}</span></div>{{ if or (gt (.Int "docker.failed") 0) (gt (.Int "docker.unhealthy") 0) (gt (len (.Array "docker.stack_problems")) 0) }}<div class="cw-alert">{{ .Int "docker.failed" }} stopped / other · {{ .Int "docker.unhealthy" }} unhealthy · {{ len (.Array "docker.stack_problems") }} stack issues</div>{{ end }}{{ else }}<div class="cw-no-docker">{{ if .String "docker.status" }}{{ .String "docker.status" }}{{ else }}No Docker data{{ end }}</div>{{ if gt (len (.Array "docker.stack_problems")) 0 }}<div class="cw-alert">{{ len (.Array "docker.stack_problems") }} stack issues ▸</div>{{ end }}{{ end }}<span class="cw-hide-hint">Hide containers ↑</span></summary><div class="cw-docker-expanded" id="cw-containers-{{ .String "type" }}-{{ .Int "id" }}"><div class="cw-collapse-bar"><button type="button" data-cw-collapse>Hide containers ↑</button></div>{{ if .Bool "docker.available" }}<div class="cw-docker-scope">Komodo / Docker · CPU is summed across cores and can exceed 100%; RAM is summed container accounting, not host memory.<br>Measured running containers: CPU {{ .Int "docker.cpu_coverage.measured" }}/{{ .Int "docker.cpu_coverage.running" }} · RAM {{ .Int "docker.ram_coverage.measured" }}/{{ .Int "docker.ram_coverage.running" }} · server sample {{ .Float "docker.age_seconds" | printf "%.0f" }}s old.</div>{{ else }}<p class="cw-docker-scope">No current identity-verified Docker inventory. This is not a claim of zero containers or no installed daemon.</p>{{ end }}<div class="cw-container-table">{{ range .Array "docker.containers" }}<a class="cw-container cc-container-link" href="{{ .String "url" }}" target="_blank" rel="noopener noreferrer"><div><strong>{{ .String "name" }}</strong><small>{{ .String "status" }}</small></div><span class="cw-state cw-state-{{ .String "state" }}">{{ .String "state" }}</span><span>{{ if ne (.String "cpu") "" }}{{ .Float "cpu" | printf "%.2f" }}% CPU{{ else }}CPU —{{ end }}</span><span>{{ .String "ram" }}</span></a>{{ end }}</div>{{ range .Array "docker.stack_problems" }}<div class="cw-problem"><a href="https://komodo.graymatter.ch/stacks/{{ .String "id" }}" target="_blank" rel="noopener noreferrer">{{ .String "name" }} ↗</a><span>{{ .String "state" }} · stack</span></div>{{ end }}</div></details></article>{{ end }}</details><div class="k-note">PVE remains authoritative for guest inventory, state, CPU and LXC metrics. VM RAM / filesystem fallback remains identity-verified Periphery. Docker CPU/RAM are separate container sums, not host utilization; shared accounting can overlap. Disabled Docker resources are excluded. A stopped PVE guest is not automatically disabled. UI refresh 1s; collector cache 5s; PVE samples ~10s.</div>{{ end }}{{ if .JSON.String "docker_exceptions.error" }}<div class="k-warning">{{ .JSON.String "docker_exceptions.error" }}</div>{{ else }}{{ if .JSON.Bool "docker_exceptions.show_any" }}<div class="cw-unmatched">{{ if .JSON.Bool "docker_exceptions.show_unmatched" }}<details class="k-stack-group"><summary><strong>{{ len (.JSON.Array "docker_unmatched") }} unmatched Docker hosts</strong><span>identity not joined</span></summary><div class="k-note">Enabled Docker hosts without an exact current Proxmox identity. No name-based or IP-only guessing.</div>{{ range .JSON.Array "docker_unmatched" }}<details class="cw-unmatched-host"><summary><strong>{{ .String "host" }}</strong><span>{{ if .Bool "available" }}{{ .Int "running" }}/{{ .Int "total" }} running · {{ .Int "failed" }} stopped / other · {{ .Int "unhealthy" }} unhealthy{{ else }}{{ .String "status" }}{{ end }} · {{ len (.Array "stack_problems") }} stack issues</span></summary><a class="cw-host-link" href="{{ .String "url" }}" target="_blank" rel="noopener noreferrer">Open exact Komodo host ↗</a><div class="cw-container-table">{{ range .Array "containers" }}<a class="cw-container cc-container-link" href="{{ .String "url" }}" target="_blank" rel="noopener noreferrer"><div><strong>{{ .String "name" }}</strong><small>{{ .String "status" }}</small></div><span class="cw-state cw-state-{{ .String "state" }}">{{ .String "state" }}</span><span>{{ if ne (.String "cpu") "" }}{{ .Float "cpu" | printf "%.2f" }}% CPU{{ else }}CPU —{{ end }}</span><span>{{ .String "ram" }}</span></a>{{ end }}</div>{{ range .Array "stack_problems" }}<div class="cw-problem"><a href="https://komodo.graymatter.ch/stacks/{{ .String "id" }}" target="_blank" rel="noopener noreferrer">{{ .String "name" }} ↗</a><span>{{ .String "state" }} · stack</span></div>{{ end }}</details>{{ end }}</details>{{ end }}{{ if .JSON.Bool "docker_exceptions.show_definitions" }}<details class="k-stack-group"><summary><strong>{{ len (.JSON.Array "definition_issues") }} unassigned definitions</strong><span>runtime unknown</span></summary><div class="k-note">Definitions without an assigned server/swarm are retained separately, not confirmed runtime incidents.</div>{{ range .JSON.Array "definition_issues" }}<a class="cw-container" href="https://komodo.graymatter.ch/stacks/{{ .String "id" }}" target="_blank" rel="noopener noreferrer"><strong>{{ .String "name" }}</strong><span>Unassigned · runtime unknown</span></a>{{ end }}</details>{{ end }}</div>{{ end }}{{ end }}{{ end }}'
    - type: custom-api
      title: Docker Containers - Top Consumers
      css-class: komodo-widget top-consumers
      cache: 1s
      update-interval: 1s
      url: http://workload-summary:8090/current
      template: '{{ if .JSON.String "error" }}<div class="k-warning">{{ .JSON.String "error" }}</div>{{ else }}<div class="k-note">{{ .JSON.String "freshness.state" }} · snapshot age {{ printf "%.0f" (.JSON.Float "freshness.age_seconds") }}s · max 30s</div><div class="k-top-grid"><section><h3>CPU · top 5</h3>{{ range .JSON.Array "top_cpu" }}<div class="k-top-row"><div><a class="k-rank-link" href="{{ .String "url" }}" target="_blank"
        rel="noopener noreferrer">{{ .String "name" }}</a><small>{{ .String "host" }}</small></div><b>{{ printf "%.1f" (.Float "cpu") }}%</b></div>{{ else }}<p>CPU metrics unavailable</p>{{
        end }}</section><section><h3>RAM · top 5</h3>{{ range .JSON.Array "top_ram" }}<div class="k-top-row"><div><a class="k-rank-link" href="{{ .String "url" }}" target="_blank" rel="noopener
        noreferrer">{{ .String "name" }}</a><small>{{ .String "host" }}</small></div><b>{{ .String "ram" }}</b></div>{{ else }}<p>RAM metrics unavailable</p>{{ end }}</section><section><h3>Disk
        capacity · top 5 hosts</h3>{{ range .JSON.Array "top_disk" }}<div class="k-top-row"><div>{{ if .String "url" }}<a class="k-rank-link" href="{{ .String "url" }}" target="_blank" rel="noopener noreferrer">{{ .String "name" }}</a>{{ else }}<strong title="Proxmox identity not verified">{{ .String "name" }}</strong>{{ end }}<small>{{ printf "%.1f" (.Float "used") }} / {{ printf "%.1f" (.Float "total") }} GiB</small></div><b>{{ printf "%.1f" (.Float "percent") }}%</b></div>{{
        else }}<p>Disk metrics unavailable</p>{{ end }}</section></div><div class="k-note">Measured by Docker via Komodo · running enabled workloads · UI refresh 1s · collector cache 5s</div><div class="k-note">Disk:
        enabled reporting Komodo hosts ranked by aggregate filesystem % used. Not container size, physical HDD usage or I/O rate; mounts may overlap. CPU/RAM: running containers; Docker
        CPU may exceed 100%.</div>{{ end }}'
