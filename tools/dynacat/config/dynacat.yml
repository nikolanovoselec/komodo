server:
  port: 8080
  assets-path: /app/assets
  cache-dir: /app/assets/.cache
  allow-editing: false
  proxied: true
branding:
  app-name: Gray Matter Command Center
  hide-logo: false
  custom-footer: <span>Gray Matter · private operational workspace</span>
  logo-text: GM
  hide-footer: true
  show-desktop-navigation-on-hover: true
  center-desktop-navigation: true
theme:
  background-color: 216 18 8
  primary-color: 8 78 62
  positive-color: 151 49 54
  negative-color: 1 79 62
  contrast-multiplier: 1.25
  text-saturation-multiplier: 0.72
  disable-picker: false
  presets:
    teal-city:
      background-color: 225 14 15
      primary-color: 157 47 65
      contrast-multiplier: 1.1
    midnight-navy:
      background-color: 222 20 7
      primary-color: 215 50 60
      contrast-multiplier: 1.1
    camouflage:
      background-color: 186 21 20
      contrast-multiplier: 1.2
      primary-color: 97 13 80
    catppuccin-frappe:
      background-color: 229 19 23
      contrast-multiplier: 1.2
      primary-color: 222 74 74
      positive-color: 96 44 68
      negative-color: 359 68 71
    catppuccin-macchiato:
      background-color: 232 23 18
      contrast-multiplier: 1.2
      primary-color: 220 83 75
      positive-color: 105 48 72
      negative-color: 351 74 73
    catppuccin-mocha:
      background-color: 240 21 15
      contrast-multiplier: 1.2
      primary-color: 217 92 83
      positive-color: 115 54 76
      negative-color: 347 70 65
    gruvbox-dark:
      background-color: 0 0 16
      primary-color: 43 59 81
      positive-color: 61 66 44
      negative-color: 6 96 59
    kanagawa-dark:
      background-color: 240 13 14
      primary-color: 51 33 68
      negative-color: 358 100 68
      contrast-multiplier: 1.2
    tucan:
      background-color: 50 1 6
      primary-color: 24 97 58
      negative-color: 209 88 54
    dracula:
      background-color: 231 15 21
      primary-color: 265 89 79
      contrast-multiplier: 1.2
      positive-color: 135 94 66
      negative-color: 0 100 67
    shades-of-purple:
      background-color: 243 33 25
      contrast-multiplier: 1.2
      primary-color: 50 100 49
      positive-color: 98 82 71
      negative-color: 12 77 52
    neon-pink-:
      background-color: 240 27 11
      contrast-multiplier: 1.5
      primary-color: 321 100 71
      positive-color: 165 78 51
      negative-color: 360 100 71
    degoog-dark:
      background-color: 227 11 16
      contrast-multiplier: 1.2
      primary-color: 220 34 51
      positive-color: 136 53 43
      negative-color: 5 81 56
    catppuccin-latte:
      light: true
      background-color: 220 23 95
      contrast-multiplier: 1.0
      primary-color: 220 91 54
      positive-color: 109 58 40
      negative-color: 347 87 44
    peachy:
      light: true
      background-color: 28 40 77
      primary-color: 155 100 20
      negative-color: 0 100 60
      contrast-multiplier: 1.1
      text-saturation-multiplier: 0.5
    zebra:
      light: true
      background-color: 0 0 95
      primary-color: 0 0 10
      negative-color: 0 90 50
    morning-paper:
      light: true
      background-color: 40 10 95
      primary-color: 25 50 35
      text-saturation-multiplier: 0.8
    heather-mist:
      light: true
      background-color: 270 12 97
      primary-color: 270 35 50
    degoog-light:
      light: true
      background-color: 0 0 95
      contrast-multiplier: 1.1
      primary-color: 217 36 36
      positive-color: 136 53 40
      negative-color: 5 81 56
  custom-css-file: /assets/command-center.css
pages:
- name: Command Center
  name-icon: mdi:radar
  width: wide
  desktop-navigation-width: wide
  key-bind: d h
  head-widgets:
  - type: html
    frameless: true
    css-class: command-banner
    source: <div class="cc-eyebrow">GRAY MATTER · PRIVATE OPERATIONS</div><div class="cc-title">COMMAND CENTER <span>LIVE</span></div><div
      class="cc-subtitle">Fleet telemetry · service health · container estate · media operations</div>
  columns:
  - size: small
    widgets:
    - type: clock
      hour-format: 24h
      timezones:
      - timezone: Europe/Zurich
        label: Bern
      - timezone: America/New_York
        label: New York
    - type: weather
      location: Bern, Switzerland
      units: metric
      hour-format: 24h
      show-area-name: false
    - type: monitor
      title: Service health
      title-icon: mdi:heart-pulse
      style: compact
      show-history: true
      update-interval: 2m
      sites:
      - title: Komodo
        url: https://komodo.graymatter.ch
      - title: Beszel
        url: https://beszel.graymatter.ch
      - title: Dozzle
        url: https://dozzle.local.graymatter.ch
      - title: Uptime Kuma
        url: https://status.graymatter.ch/dashboard
      - title: Proxmox
        url: https://proxmox.graymatter.ch
      - title: Plex
        url: https://plex.novoselec.ch
    - type: bookmarks
      css-class: quick-links
      groups:
      - title: Control plane
        color: 8 78 62
        links:
        - title: Komodo
          url: https://komodo.graymatter.ch
          icon: si:komodo
        - title: Beszel
          url: https://beszel.graymatter.ch
          icon: mdi:chart-areaspline
        - title: Dozzle
          url: https://dozzle.local.graymatter.ch
          icon: mdi:docker
        - title: Proxmox
          url: https://proxmox.graymatter.ch
          icon: si:proxmox
  - size: full
    widgets:
    - type: html
      frameless: true
      css-class: section-label
      source: <div><span class="status-dot"></span> LIVE FLEET TELEMETRY <small>Beszel · CPU / memory / disk / load
        / network / alerts</small></div>
    - type: iframe
      source: https://beszel.local.graymatter.ch/
      height: 700
      css-class: telemetry-frame
    - type: split-column
      widgets:
      - type: html
        title: Virtualisation estate
        title-icon: mdi:server-network
        source: <div class="metric-grid"><a href="https://proxmox.graymatter.ch"><strong>Proxmox I</strong><span>Compute
          & LXC</span></a><a href="https://proxmox.graymatter.ch"><strong>Proxmox II</strong><span>Compute & LXC</span></a><a
          href="https://proxmox.graymatter.ch"><strong>Proxmox III</strong><span>Compute & LXC</span></a></div>
      - type: releases
        title: Critical releases
        title-icon: mdi:package-variant-closed
        show-source-icon: true
        name-only: true
        limit: 5
        collapse-after: 5
        repositories:
        - Panonim/dynacat
        - dockerhub:linuxserver/plex
        - dockerhub:linuxserver/sonarr
        - dockerhub:linuxserver/radarr
        - dockerhub:qbittorrentofficial/qbittorrent-nox
  - size: small
    widgets:
    - type: html
      frameless: true
      css-class: section-label
      source: <div><span class="status-dot"></span> CONTAINER ESTATE <small>Dozzle · 12 hosts</small></div>
    - type: iframe
      source: https://dozzle.local.graymatter.ch/
      height: 700
      css-class: dozzle-frame
    - type: rss
      title: Infrastructure signal
      title-icon: mdi:rss
      style: vertical-list
      limit: 8
      collapse-after: 6
      single-line-titles: true
      feeds:
      - title: Krebs on Security
        url: https://krebsonsecurity.com/feed/
      - title: The Register
        url: https://www.theregister.com/headlines.atom
- name: Media Ops
  slug: media-ops
  name-icon: mdi:play-circle
  width: wide
  desktop-navigation-width: wide
  key-bind: d m
  columns:
  - size: small
    widgets:
    - type: torrenting
      title: Active downloads
      title-icon: mdi:download-network
      update-interval: 30s
      hide-completed: true
      hide-inactive: true
      wrap-text: true
      collapse-after: 8
      hosts:
      - url: http://192.168.2.38:8080
        username: ''
        password: ''
    - type: calendar
      title: Release calendar
      title-icon: mdi:calendar-star
      show-release-state: true
      update-interval: 30m
      hosts:
      - url: sonarr:http://192.168.2.38:8988
        public-url: https://sonarr.graymatter.ch
        token: ${SONARR_API_KEY}
      - url: radarr:http://192.168.2.38:8309
        public-url: https://radarr.graymatter.ch
        token: ${RADARR_API_KEY}
    - type: bookmarks
      groups:
      - title: Media control
        color: 222 74 74
        links:
        - title: Plex
          url: https://plex.novoselec.ch
          icon: si:plex
        - title: qBittorrent
          url: https://qbittorrent.graymatter.ch
          icon: si:qbittorrent
        - title: Sonarr
          url: https://sonarr.graymatter.ch
          icon: si:sonarr
        - title: Radarr
          url: https://radarr.graymatter.ch
          icon: si:radarr
  - size: full
    widgets:
    - type: html
      frameless: true
      css-class: section-label
      source: <div><span class="status-dot"></span> MEDIA CONTROL <small>Downloads · releases · servers · library</small></div>
    - type: iframe
      source: https://dozzle.local.graymatter.ch/
      height: 500
      css-class: dozzle-frame
    - type: videos
      title: Architecture & technology
      title-icon: mdi:youtube
      channels:
      - UCXuqSBlHAE6Xw-yeJA0Tunw
      - UCBJycsmduvYEL83R_U4JriQ
      - UCHnyfMqiRRG1u-2MsSQLbXA
      style: grid-cards
      limit: 9
      collapse-after-rows: 1
  - size: small
    widgets:
    - type: monitor
      title: Media services
      style: compact
      show-history: true
      sites:
      - title: Plex
        url: https://plex.novoselec.ch
      - title: Sonarr
        url: https://sonarr.graymatter.ch
      - title: Radarr
        url: https://radarr.graymatter.ch
      - title: qBittorrent
        url: https://qbittorrent.graymatter.ch
      - title: Tautulli
        url: https://tautulli.graymatter.ch
    - type: rss
      title: Media signal
      style: vertical-list
      limit: 8
      collapse-after: 6
      single-line-titles: true
      feeds:
      - title: Ars Technica
        url: https://feeds.arstechnica.com/arstechnica/index
