- name: Media
  slug: media
  name-icon: mdi:play-circle
  width: wide
  desktop-navigation-width: wide
  key-bind: d m
  columns:
  - size: full
    widgets:
    - type: custom-api
      title: Media
      frameless: true
      css-class: media-ops-widget
      cache: 1s
      update-interval: 1s
      url: http://workload-summary:8090/media-current
      template: '<div class="mo-page mo-live">

        <div class="mo-head"><div><span class="mo-eyebrow">THE SCREENING ROOM</span><h2>Media</h2><p>Playback, libraries and delivery — one live view.</p></div><span class="mo-live-label"><i></i> LIVE OPERATIONS</span></div>

        {{ if .JSON.String "sessions.error" }}<div class="mo-notice">{{ .JSON.String "sessions.error" }} · DYNACAT_PLEX_TOKEN must be available to the collector.</div>{{ else }}

        <div class="mo-kpis"><div><b>{{ .JSON.Int "sessions.data.count" }}</b><span>Concurrent streams</span></div><div><b>{{ .JSON.Int "sessions.data.direct" }}</b><span>Direct play</span></div><div><b>{{ .JSON.Int "sessions.data.transcoding" }}</b><span>Transcoding</span></div><div><b>{{ if .JSON.Bool "sessions.data.has_bandwidth" }}{{ .JSON.Float "sessions.data.bandwidth_mbps" }}<small> Mbps</small>{{ else }}—{{ end }}</b><span>Plex reserved bandwidth · {{ .JSON.Int "sessions.data.bandwidth_coverage" }}/{{ .JSON.Int "sessions.data.count" }} streams reported</span></div></div>

        <div class="mo-section"><h3>Now playing</h3><small>Plex sessions · {{ .JSON.Int "sessions.age" }}s since collection · UI 1s / source cache 5s</small></div>

        <div class="mo-players">{{ range .JSON.Array "sessions.data.streams" }}<article class="mo-player">{{ if .String "plex_url" }}<a class="mo-player-link" href="{{ .String "plex_url" }}" target="_blank" rel="noopener noreferrer" aria-label="Open {{ .String "title" }} {{ .String "subtitle" }} in Plex">{{ else }}<div class="mo-player-link">{{ end }}<div class="mo-player-art">{{ if .String "poster" }}<img src="data:image/jpeg;base64,{{ .String "poster" }}" alt="{{ .String "title" }} poster" width="200" height="300">{{ else }}<span class="mo-art-placeholder">{{ .String "type" }}</span>{{ end }}</div><div class="mo-player-info"><div class="mo-player-top"><span class="mo-badge">{{ .String "state" }}</span><span>{{ .String "mode" }} · {{ .String "resolution" }}</span></div><h3>{{ .String "title" }} ↗</h3><p>{{ .String "subtitle" }}</p><div class="mo-progress"><i style="width:{{ .Float "progress" }}%"></i></div><div class="mo-player-bottom"><span>{{ .String "user" }} · {{ .String "player" }}</span><span>{{ .Float "progress" | printf "%.0f" }}% · {{ .String "location" }}</span></div>{{ if not (.String "plex_url") }}<small>Exact Plex link unavailable</small>{{ end }}</div>{{ if .String "plex_url" }}</a>{{ else }}</div>{{ end }}{{ if .String "imdb" }}<a class="mo-imdb" href="{{ .String "imdb" }}" target="_blank" rel="noopener noreferrer">IMDb ↗</a>{{ end }}</article>{{ else }}<div class="mo-idle"><span>Ⅱ</span><div><h3>The room is quiet</h3><p>Plex reports no active playback. New sessions appear here automatically.</p></div></div>{{ end }}</div>{{ end }}

        <div class="mo-section"><h3>Media servers</h3><small>Komodo / Docker · {{ .JSON.Int "resources.age" }}s since collection</small></div>

        {{ if .JSON.String "resources.error" }}<div class="mo-notice">{{ .JSON.String "resources.error" }}</div>{{ else }}<div class="mo-servers">{{ range .JSON.Array "resources.data.servers" }}<a class="mo-server" href="{{ .String "url" }}" target="_blank" rel="noopener noreferrer"><div class="mo-server-title"><h3>{{ .String "name" }}</h3><span class="mo-state mo-state-{{ if .Bool "disabled" }}disabled{{ else }}{{ .String "state" }}{{ end }}">{{ if .Bool "disabled" }}disabled · {{ end }}{{ .String "state" }}</span></div><div class="mo-server-metrics"><div><small>CPU · Docker</small><b>{{ if .Bool "has_cpu" }}{{ .Float "cpu" | printf "%.2f" }}%{{ else }}—{{ end }}</b></div><div><small>RAM · container</small><b>{{ .String "ram" }}</b></div></div><p>{{ .String "status" }}</p><small>Network: {{ .String "bandwidth" }}</small></a>{{ end }}</div><section class="mo-traffic" aria-label="Media host network bandwidth"><div class="mo-traffic-heading"><div><span class="mo-eyebrow">NETWORK ACTIVITY</span><h3>Media host bandwidth</h3><small>All interfaces · sampled interval rates, not per-app traffic</small></div><span class="mo-traffic-freshness">{{ .JSON.String "resources.data.traffic.state" }} · {{ if .JSON.Bool "resources.data.traffic.has_age" }}source {{ .JSON.Float "resources.data.traffic.age_seconds" | printf "%.0f" }}s ago{{ else }}age unknown{{ end }}</span></div><div class="mo-traffic-rates"><div class="mo-rx"><span>↓ Receive</span><b>{{ if .JSON.Bool "resources.data.traffic.available" }}{{ .JSON.Float "resources.data.traffic.rx_mbps" | printf "%.2f" }}{{ else }}—{{ end }} <small>Mbps</small></b></div><div class="mo-tx"><span>↑ Transmit</span><b>{{ if .JSON.Bool "resources.data.traffic.available" }}{{ .JSON.Float "resources.data.traffic.tx_mbps" | printf "%.2f" }}{{ else }}—{{ end }} <small>Mbps</small></b></div><small>Measured bytes / {{ if .JSON.Bool "resources.data.traffic.has_interval" }}{{ .JSON.Int "resources.data.traffic.interval_seconds" }}s{{ else }}unknown{{ end }} source interval<br>Not Plex reserved bandwidth</small></div><div class="mo-traffic-plot"><span class="mo-traffic-scale">{{ .JSON.Float "resources.data.traffic.graph.scale_mbps" }} Mbps</span><svg viewBox="0 0 600 100" preserveAspectRatio="none" role="img" aria-label="Receive solid line and transmit dashed line, shared Mbps scale, ten-minute window"><path class="mo-traffic-grid" d="M0 0H600 M0 50H600 M0 100H600 M150 0V100 M300 0V100 M450 0V100"/>{{ range .JSON.Array "resources.data.traffic.graph.series" }}<g class="mo-traffic-{{ .String "key" }}"><path d="{{ .String "path" }}"/>{{ range .Array "points" }}<circle cx="{{ .Float "x" }}" cy="{{ .Float "y" }}" r="1.5"/>{{ end }}</g>{{ end }}</svg>{{ if .JSON.Bool "resources.data.traffic.warmup" }}<span class="mo-traffic-warmup">Collecting real samples · history starts now</span>{{ end }}</div><div class="mo-traffic-axis"><span>−10 min</span><span>−5 min</span><span>Latest sample</span></div><div class="mo-traffic-foot"><small>{{ .JSON.Int "resources.data.traffic.graph.samples" }} real samples · {{ .JSON.Int "resources.data.traffic.graph.span_seconds" }}s observed · gaps ≥30s are not connected</small><small>Komodo / Periphery · history resets on collector restart</small></div></section>{{ end }}

        </div>'
    - type: custom-api
      title: Plex library
      frameless: true
      css-class: media-ops-widget
      cache: 10s
      update-interval: 10s
      url: http://workload-summary:8090/media-library
      template: <div class="mo-page"><div class="mo-section"><h3>Library pulse</h3><small>Plex library API · {{ .JSON.Int "library.age" }}s since collection · cache 5m</small></div>{{ if .JSON.String "library.error" }}<div class="mo-notice">{{ .JSON.String "library.error" }}</div>{{ else }}<div class="mo-libraries">{{ range .JSON.Array "library.data.libraries" }}<div><b>{{ .Int "total" }}</b><span>{{ .String "title" }}</span><small>{{ .String "type" }} library items</small></div>{{ end }}</div><div class="mo-section"><h3>Fresh on Plex</h3><small>Latest movies & episodes · newest first</small></div><div class="mo-posters">{{ range .JSON.Array "library.data.recent" }}<article class="mo-poster">{{ if .String "url" }}<a class="mo-poster-link" href="{{ .String "url" }}" target="_blank" rel="noopener noreferrer" aria-label="Open {{ .String "title" }} {{ .String "subtitle" }}">{{ end }}<div class="mo-art">{{ if .String "poster" }}<img src="data:image/jpeg;base64,{{ .String "poster" }}" alt="{{ .String "title" }} poster" loading="lazy" width="200" height="300">{{ else }}<span class="mo-art-placeholder">{{ .String "type" }}</span>{{ end }}<span class="mo-art-type">{{ .String "type" }}</span></div>{{ if .String "url" }}</a>{{ end }}<h3>{{ if .String "url" }}<a class="mo-item-title" href="{{ .String "url" }}" target="_blank" rel="noopener noreferrer">{{ .String "title" }} ↗</a>{{ else }}{{ .String "title" }}{{ end }}{{ if .String "imdb" }} <a class="mo-imdb" href="{{ .String "imdb" }}" target="_blank" rel="noopener noreferrer">IMDb ↗</a>{{ end }}</h3><p>{{ .String "subtitle" }}</p><small>{{ .String "library" }} · <span data-dynamic-relative-time="{{ .Int "added_at" }}"></span></small></article>{{ else }}<p class="mo-notice">Plex returned no recent video additions.</p>{{ end }}</div>{{ end }}</div>{{ if .JSON.String "library.error" }}<div class="mo-page"><div class="mo-section"><h3>Just landed</h3><small>Verified Sonarr / Radarr imports · not Plex membership</small></div>{{ if .JSON.String "imports.error" }}<div class="mo-notice">{{ .JSON.String "imports.error" }}</div>{{ else }}<div class="mo-posters">{{ range .JSON.Array "imports.data.recent" }}<article class="mo-poster">{{ if .String "url" }}<a class="mo-poster-link" href="{{ .String "url" }}" target="_blank" rel="noopener noreferrer" aria-label="Open {{ .String "title" }} {{ .String "subtitle" }}">{{ end }}<div class="mo-art">{{ if .String "poster" }}<img src="data:image/jpeg;base64,{{ .String "poster" }}" alt="{{ .String "title" }} poster" loading="lazy" width="200" height="300">{{ else }}<span class="mo-art-placeholder">{{ .String "type" }}</span>{{ end }}<span class="mo-art-type">{{ .String "type" }}</span></div>{{ if .String "url" }}</a>{{ end }}<h3>{{ if .String "url" }}<a class="mo-item-title" href="{{ .String "url" }}" target="_blank" rel="noopener noreferrer">{{ .String "title" }} ↗</a>{{ else }}{{ .String "title" }}{{ end }}{{ if .String "imdb" }} <a class="mo-imdb" href="{{ .String "imdb" }}" target="_blank" rel="noopener noreferrer">IMDb ↗</a>{{ end }}</h3><p>{{ .String "subtitle" }}</p><small>{{ .String "library" }} · <span data-dynamic-relative-time="{{ .Int "added_at" }}"></span></small></article>{{ else }}<p class="mo-notice">No recent imports returned.</p>{{ end }}</div>{{ end }}</div>{{ end }}
  - size: small
