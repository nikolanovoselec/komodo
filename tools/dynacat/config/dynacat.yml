pages:
- name: Operations
  columns:
  - size: small
    widgets:
    - type: monitor
      title: Core services
      style: compact
      show-history: true
      update-interval: 2m
      sites:
      - title: Komodo
        url: https://komodo.graymatter.ch
      - title: Authentik
        url: https://authentik.graymatter.ch/if/admin/#/administration/overview
      - title: Beszel
        url: https://beszel.graymatter.ch
      - title: Uptime Kuma
        url: https://status.graymatter.ch/dashboard
      - title: Proxmox
        url: https://proxmox.graymatter.ch
      - title: Proxmox Backup Server
        url: https://pbs.graymatter.ch/
      - title: Portainer
        url: https://portainer.graymatter.ch
      - title: Termix
        url: https://termix.novoselec.ch
