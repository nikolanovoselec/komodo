      url: http://workload-summary:8090/network-current
      template: |
        <div class="nw-dashboard">
        {{ if .JSON.String "error" }}<p class="nw-warning" role="status">{{ .JSON.String "error" }}</p>{{ end }}
        {{ if .JSON.Bool "partial" }}<p class="nw-warning">Partial visibility · some network capabilities are unavailable.</p>{{ end }}
        {{ define "nw-device" }}<article class="nw-device {{ if eq (.String "kind") "gateway" }}nw-gateway{{ end }}"><header><div><span class="nw-eyebrow">{{ .String "kind" }}</span><h4>{{ if .String "url" }}<a href="{{ .String "url" }}" rel="noopener noreferrer">{{ .String "name" }} ↗</a>{{ else }}{{ .String "name" }}{{ end }}</h4></div><span class="nw-state {{ if ne (.String "state") "ONLINE" }}nw-warning{{ end }}">{{ .String "state" }}</span></header><p class="nw-meta">{{ .String "model" }}{{ if .String "ip" }} · {{ .String "ip" }}{{ end }}</p><div class="nw-metrics"><div class="nw-metric"><div class="nw-metric-label"><span>CPU</span><b>{{ if ne (.String "cpu_percent") "" }}{{ printf "%.1f" (.Float "cpu_percent") }}%{{ else }}Unavailable{{ end }}</b></div>{{ if and (gt (.Int "history.cpu.samples") 1) (.String "history.cpu.path") }}<svg viewBox="0 0 100 30" preserveAspectRatio="none" role="img" aria-label="CPU over the last 30 minutes"><path class="nw-gridline" d="M0 0 H100 M0 15 H100 M0 30 H100"/>{{ if .String "history.cpu.area_path" }}<path class="nw-area" d="{{ .String "history.cpu.area_path" }}"/>{{ end }}<path d="{{ .String "history.cpu.path" }}"/>{{ range .Array "history.cpu.dots" }}<circle cx="{{ .Float "x" }}" cy="{{ .Float "y" }}" r="0.7"/>{{ end }}</svg><div class="nw-axis"><span>−30m</span><span>0–{{ printf "%.1f" (.Float "history.cpu.scale") }}%</span><span>now</span></div>{{ else }}<p class="nw-no-history">{{ if eq (.String "history.cpu.state") "collecting" }}Collecting history{{ else }}History unavailable{{ end }}</p>{{ end }}</div><div class="nw-metric"><div class="nw-metric-label"><span>MEMORY</span><b>{{ if ne (.String "memory_percent") "" }}{{ printf "%.1f" (.Float "memory_percent") }}%{{ else }}Unavailable{{ end }}</b></div>{{ if and (gt (.Int "history.ram.samples") 1) (.String "history.ram.path") }}<svg viewBox="0 0 100 30" preserveAspectRatio="none" role="img" aria-label="MEMORY over the last 30 minutes"><path class="nw-gridline" d="M0 0 H100 M0 15 H100 M0 30 H100"/>{{ if .String "history.ram.area_path" }}<path class="nw-area" d="{{ .String "history.ram.area_path" }}"/>{{ end }}<path d="{{ .String "history.ram.path" }}"/>{{ range .Array "history.ram.dots" }}<circle cx="{{ .Float "x" }}" cy="{{ .Float "y" }}" r="0.7"/>{{ end }}</svg><div class="nw-axis"><span>−30m</span><span>0–{{ printf "%.1f" (.Float "history.ram.scale") }}%</span><span>now</span></div>{{ else }}<p class="nw-no-history">{{ if eq (.String "history.ram.state") "collecting" }}Collecting history{{ else }}History unavailable{{ end }}</p>{{ end }}</div><div class="nw-metric"><div class="nw-metric-label"><span>RX</span><b>{{ if ne (.String "rx_mbps") "" }}{{ printf "%.1f" (.Float "rx_mbps") }} Mbps{{ else }}Unavailable{{ end }}</b></div>{{ if and (gt (.Int "history.rx.samples") 1) (.String "history.rx.path") }}<svg viewBox="0 0 100 30" preserveAspectRatio="none" role="img" aria-label="RX over the last 30 minutes"><path class="nw-gridline" d="M0 0 H100 M0 15 H100 M0 30 H100"/>{{ if .String "history.rx.area_path" }}<path class="nw-area" d="{{ .String "history.rx.area_path" }}"/>{{ end }}<path d="{{ .String "history.rx.path" }}"/>{{ range .Array "history.rx.dots" }}<circle cx="{{ .Float "x" }}" cy="{{ .Float "y" }}" r="0.7"/>{{ end }}</svg><div class="nw-axis"><span>−30m</span><span>0–{{ printf "%.1f" (.Float "history.rx.scale") }} Mbps</span><span>now</span></div>{{ else }}<p class="nw-no-history">{{ if eq (.String "history.rx.state") "collecting" }}Collecting history{{ else }}History unavailable{{ end }}</p>{{ end }}</div><div class="nw-metric"><div class="nw-metric-label"><span>TX</span><b>{{ if ne (.String "tx_mbps") "" }}{{ printf "%.1f" (.Float "tx_mbps") }} Mbps{{ else }}Unavailable{{ end }}</b></div>{{ if and (gt (.Int "history.tx.samples") 1) (.String "history.tx.path") }}<svg viewBox="0 0 100 30" preserveAspectRatio="none" role="img" aria-label="TX over the last 30 minutes"><path class="nw-gridline" d="M0 0 H100 M0 15 H100 M0 30 H100"/>{{ if .String "history.tx.area_path" }}<path class="nw-area" d="{{ .String "history.tx.area_path" }}"/>{{ end }}<path d="{{ .String "history.tx.path" }}"/>{{ range .Array "history.tx.dots" }}<circle cx="{{ .Float "x" }}" cy="{{ .Float "y" }}" r="0.7"/>{{ end }}</svg><div class="nw-axis"><span>−30m</span><span>0–{{ printf "%.1f" (.Float "history.tx.scale") }} Mbps</span><span>now</span></div>{{ else }}<p class="nw-no-history">{{ if eq (.String "history.tx.state") "collecting" }}Collecting history{{ else }}History unavailable{{ end }}</p>{{ end }}</div></div><footer>{{ if ne (.String "ports_active") "" }}<span>Ports <b>{{ .Int "ports_active" }}{{ if ne (.String "ports_total") "" }}/{{ .Int "ports_total" }}{{ end }}</b></span>{{ end }}{{ if ne (.String "clients_count") "" }}<span>Clients <b>{{ .Int "clients_count" }}</b></span>{{ end }}{{ if ne (.String "uptime_seconds") "" }}<span>Uptime <b>{{ printf "%.1f" (div (.Float "uptime_seconds") 3600) }}h</b></span>{{ end }}</footer></article>{{ end }}
        <div class="nw-top-row"><section class="nw-pihole">
          {{ if .JSON.String "pihole.error" }}<div class="k-warning">{{ .JSON.String "pihole.error" }}</div>{{ end }}
