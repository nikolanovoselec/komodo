services:
  openclaw-gateway:
    image: ghcr.io/openclaw/openclaw:2026.9.1
    container_name: openclaw_openclaw_gateway
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_DISABLE_BONJOUR: "1"
      TZ: Europe/Zurich
    volumes:
      - /docker/configs/openclaw/config:/home/node/.openclaw
      - /docker/configs/openclaw/workspace:/home/node/.openclaw/workspace
      - /docker/configs/openclaw/auth:/home/node/.config/openclaw
    ports:
      - "18789:18790"
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - host.docker.internal:host-gateway
    init: true
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - node dist/index.js config set gateway.auth.mode none && exec node dist/index.js gateway --bind loopback --port 18789
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  openclaw-ingress:
    image: alpine/socat:1.8.1.3
    container_name: openclaw_openclaw_ingress
    network_mode: service:openclaw-gateway
    depends_on:
      openclaw-gateway:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    command:
      - TCP-LISTEN:18790,reuseaddr,fork
      - TCP:127.0.0.1:18789

  openclaw-cli:
    image: ghcr.io/openclaw/openclaw:2026.9.1
    container_name: openclaw_openclaw_cli
    profiles:
      - cli
    network_mode: service:openclaw-gateway
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_DISABLE_BONJOUR: "1"
      BROWSER: echo
      TZ: Europe/Zurich
    volumes:
      - /docker/configs/openclaw/config:/home/node/.openclaw
      - /docker/configs/openclaw/workspace:/home/node/.openclaw/workspace
      - /docker/configs/openclaw/auth:/home/node/.config/openclaw
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    stdin_open: true
    tty: true
    init: true
    entrypoint:
      - node
      - dist/index.js
